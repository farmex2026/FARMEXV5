function avisoPago(prov,facs,contacto){
  const nro=f=>`${f.tipo?'FACTURA '+f.tipo+' ':''}${f.numero||'sin número'}`;
  const total=facs.reduce((a,f)=>a+(Number(f.importe)||0),0);
  const N='\n';
  const asunto=facs.length===1
    ? `Comprobante de pago - Factura N° ${facs[0].numero||''}`.trim()
    : `Comprobante de pago - ${facs.length} facturas`;
  const quien=(contacto&&contacto.nombre)?' '+contacto.nombre:'';
  let cuerpo=saludo()+quien+','+N+N+'Espero que se encuentre bien.'+N+N;
  if(facs.length===1){
    cuerpo+='Les adjunto el comprobante de pago correspondiente a la siguiente factura:'+N+N
          + nro(facs[0])+' por un valor de $'+nf(facs[0].importe,2)+N;
  }else{
    cuerpo+='Les adjunto el comprobante de pago correspondiente a las siguientes facturas:'+N+N
          + facs.map(f=>nro(f)+' por un valor de $'+nf(f.importe,2)).join(N)
          + N+N+'Total: $'+nf(total,2)+N;
  }
  cuerpo+=N+'Quedo a disposición por cualquier consulta.'+N+N+'Muchas gracias.'+N+'Saludos,'+N
        + (S.cfg.firmante||'Lucas Sellecchia')+N+(S.cfg.razon||'FARMEX SAIC');
  return {asunto,cuerpo,total};
}

    <div class="totem-total"><span class="nom">Total facturado</span><span class="val">${nf(T.total,2)}<i>$</i></span></div>
  </div>
  ${T.vencido?`<div class="aviso mal"><strong>Hay ${nf(T.vencido,2)} vencido sin pagar.</strong> Mirá el detalle en Facturas.</div>`:''}
  <div class="tarjeta">
    <h2>Por sector</h2>
    ${porSector.map(x=>`<div style="margin-bottom:11px">
      <div class="mrot"><span>${x.rot}<small style="font-weight:400;color:var(--tinta-suave)"> · ${x.n} factura${x.n===1?'':'s'}</small></span>
        <span class="num" style="font-weight:600">${nf(x.total,2)}</span></div>
      ${barra(x.total,maxS,'var(--cian)')}

    </div>`).join('')}
  </div>
  <div class="tarjeta">
    <h2>Por proveedor</h2>
    <p class="sub">Ordenados de mayor a menor.</p>
    ${provs.map(x=>`<div style="margin-bottom:11px">
      <div class="mrot"><span>${esc(x.p)}<small style="font-weight:400;color:var(--tinta-suave)"> · ${x.n} factura${x.n===1?'':'s'}</small></span>
        <span class="num" style="font-weight:600">${nf(x.total,2)}</span></div>
      ${barra(x.total,maxP,'#9D7CFF')}
      ${x.pendiente?`<div class="mpie">${nf(x.pendiente,2)} pendiente</div>`:''}
    </div>`).join('')}
  </div>
  ${porMedio.length?`<div class="tarjeta">
    <h2>Cómo se pagó</h2>
    <p class="sub">Solo lo que figura como pagado.</p>
    <div class="scroll"><table>

        <td class="num">${nf(x.total,2)}</td></tr>`).join('')}
      </tbody>
      <tfoot><tr class="tot"><td>Total</td><td class="num">${porMedio.reduce((a,x)=>a+x.n,0)}</td>

  <div class="tarjeta">

async function tabGastos(){
  const lista=await admin('facturas',[]);
  const CT=await contactos();
  const conFecha=lista.filter(f=>f.fecha);
  const meses=[...new Set(conFecha.map(f=>f.fecha.slice(0,7)))].sort().reverse();
  if(!conFecha.length) return `<div class="tarjeta"><h2>Gastos</h2>
    <p class="vacio">Todavía no hay facturas cargadas.<br>Se cargan en Facturas, eligiendo el sector.</p></div>`;
  if(!S.gasMes) S.gasMes=meses[0];
  const mes=S.gasMes;
  const delMes=mes==='todos'?conFecha:conFecha.filter(f=>f.fecha.slice(0,7)===mes);
  const hoy=hoyISO();

  const tot=arr=>{
    const t=arr.reduce((a,f)=>a+(Number(f.importe)||0),0);
    const pag=arr.filter(f=>f.estado==='pagada').reduce((a,f)=>a+(Number(f.importe)||0),0);
    const venc=arr.filter(f=>f.estado!=='pagada'&&f.vence&&f.vence<hoy).reduce((a,f)=>a+(Number(f.importe)||0),0);
    return {t,pag,pend:t-pag,venc,n:arr.length};
  };
  const G=tot(delMes);

  const porSector=SECT_FAC.map(([k,rot])=>({k,rot,...tot(delMes.filter(f=>(f.sector||'admin')===k))}))
    .filter(x=>x.n).sort((a,b)=>b.t-a.t);
  const provs=[...new Set(delMes.map(f=>f.proveedor||'Sin proveedor'))]
    .map(p=>({p,...tot(delMes.filter(f=>(f.proveedor||'Sin proveedor')===p))}))
    .sort((a,b)=>b.t-a.t);
  const maxS=Math.max(...porSector.map(x=>x.t),1);
  const maxP=Math.max(...provs.map(x=>x.t),1);
  const COL=['#22E3F5','#9D7CFF','#3DE0A0','#FF6B85','#FFB86B','#5B8DEF','#6FD3C7','#C08AE0'];

  // evolución mensual, para ver si el gasto sube o baja
  const serie=meses.slice(0,12).reverse().map(m=>({m,...tot(conFecha.filter(f=>f.fecha.slice(0,7)===m))}));
  const maxM=Math.max(...serie.map(x=>x.t),1);

  const barra=(v,max,color)=>`<div class="hbarras"><div class="hb">
    <i style="width:${v/max*100}%;background:${color}"></i><em>${nf(v,2)}</em></div></div>`;

  return `<div class="filtro"><span class="et">Mes</span>
    <select id="gasMes">
      <option value="todos"${mes==='todos'?' selected':''}>Todos los meses</option>
      ${meses.map(m=>`<option value="${m}"${mes===m?' selected':''}>${nombreMes(m)}</option>`).join('')}</select>
  </div>
  <div class="totem">

      <div class="d">${G.n} factura${G.n===1?'':'s'}</div></div>
    <div class="linea-totem"><span class="chip" style="background:var(--ok)"></span>
      <span class="nom">Pagado</span><span class="guia"></span><span class="val">${nf(G.pag,2)}<i>$</i></span></div>
    <div class="linea-totem"><span class="chip" style="background:var(--ambar)"></span>
      <span class="nom">Pendiente</span><span class="guia"></span><span class="val">${nf(G.pend,2)}<i>$</i></span></div>
    ${G.venc?`<div class="linea-totem"><span class="chip" style="background:var(--alerta)"></span>
      <span class="nom">Vencido</span><span class="guia"></span><span class="val">${nf(G.venc,2)}<i>$</i></span></div>`:''}
    <div class="totem-total"><span class="nom">Total facturado</span><span class="val">${nf(G.t,2)}<i>$</i></span></div>
  </div>
  ${G.venc?`<div class="aviso mal">Hay <strong>${nf(G.venc,2)}</strong> en facturas vencidas sin pagar.</div>`:''}
  <div class="tarjeta">
    <h2>Por sector</h2>
    <div class="hgraf">${porSector.map((x,i)=>`<div class="hfila">
      <div class="hnom">${esc(x.rot)}</div>${barra(x.t,maxS,COL[i%COL.length])}</div>`).join('')}</div>
    <div class="scroll" style="margin-top:11px"><table>
      <thead><tr><th>Sector</th><th class="num">Facturas</th><th class="num">Total</th><th class="num">Pagado</th><th class="num">Pendiente</th></tr></thead>
      <tbody>${porSector.map(x=>`<tr><td>${esc(x.rot)}</td><td class="num">${x.n}</td>
        <td class="num"><strong>${nf(x.t,2)}</strong></td><td class="num">${nf(x.pag,2)}</td>
        <td class="num ${x.pend?'nocumple':''}">${nf(x.pend,2)}</td></tr>`).join('')}</tbody>
      <tfoot><tr class="tot"><td>Total</td><td class="num">${G.n}</td><td class="num">${nf(G.t,2)}</td>
        <td class="num">${nf(G.pag,2)}</td><td class="num">${nf(G.pend,2)}</td></tr></tfoot>
    </table></div>
  </div>
  <div class="tarjeta">
    <h2>Por proveedor</h2>
    <p class="sub">${provs.length} proveedor${provs.length===1?'':'es'} en ${mes==='todos'?'todo el período':nombreMes(mes)}.</p>
    <div class="hgraf">${provs.slice(0,12).map((x,i)=>`<div class="hfila">
      <div class="hnom" style="font-size:11.5px">${esc(x.p)}</div>${barra(x.t,maxP,COL[i%COL.length])}</div>`).join('')}</div>
    <div class="scroll" style="margin-top:11px"><table>
      <thead><tr><th>Proveedor</th><th class="num">Facturas</th><th class="num">Total</th><th class="num">Pagado</th><th class="num">Pendiente</th></tr></thead>
      <tbody>${provs.map(x=>`<tr><td>${esc(x.p)}${(CT[x.p]||{}).nombre?`<small>${esc(CT[x.p].nombre)}</small>`:''}</td>
        <td class="num">${x.n}</td><td class="num"><strong>${nf(x.t,2)}</strong></td>
        <td class="num">${nf(x.pag,2)}</td><td class="num ${x.pend?'nocumple':''}">${nf(x.pend,2)}</td></tr>`).join('')}</tbody>
    </table></div>
  </div>
  ${serie.length>1?`<div class="tarjeta">
    <h2>Mes por mes</h2>
    <p class="sub">Total facturado en cada mes.</p>
    <div class="vgraf"><div class="vcols">${serie.map(x=>`<div class="vcol">
      <div class="vbarras"><div class="vb" style="width:66%;max-width:30px">
        <i style="height:${x.t/maxM*100}%;background:${x.m===mes?'var(--cian)':'#3E5E8A'}"></i></div></div>
      <div class="vet">${MESES[Number(x.m.slice(5,7))-1]}</div></div>`).join('')}</div></div>
    <div class="scroll" style="margin-top:11px"><table>
      <thead><tr><th>Mes</th><th class="num">Facturas</th><th class="num">Total</th><th class="num">Pendiente</th></tr></thead>
      <tbody>${serie.slice().reverse().map(x=>`<tr><td>${nombreMes(x.m)}</td><td class="num">${x.n}</td>
        <td class="num"><strong>${nf(x.t,2)}</strong></td><td class="num ${x.pend?'nocumple':''}">${nf(x.pend,2)}</td></tr>`).join('')}</tbody>
    </table></div>
  </div>`:''}
  <div class="tarjeta">
    <h2>Medios de pago</h2>
    ${(()=>{
      const pagadas=delMes.filter(f=>f.estado==='pagada');
      const med={};
      pagadas.forEach(f=>{ const k=f.medio||'Sin especificar'; med[k]=(med[k]||0)+(Number(f.importe)||0); });
      const ent=Object.entries(med).sort((a,b)=>b[1]-a[1]);
      if(!ent.length) return `<p class="vacio">Ninguna factura pagada en este mes.</p>`;
      const mx=Math.max(...ent.map(e=>e[1]),1);
      return `<div class="hgraf">${ent.map(([k,v],i)=>`<div class="hfila">
        <div class="hnom" style="font-size:11.5px">${esc(k)}</div>${barra(v,mx,COL[i%COL.length])}</div>`).join('')}</div>`;
    })()}
  </div>`;
}

async function espacioUsado(){
  let total=0, adj=0;
  for(const k of await Alm.claves()){
    const v=await Alm.get(k); const n=(v||'').length;
    total+=n; if(k.indexOf('arch:')===0) adj+=n;
  }
  return {total,adj};
}

/* ---------- render ---------- */
async function render(){
  const app=document.getElementById('app');
  if(S.cargando){ app.innerHTML=`<div class="vacio" style="padding-top:60px">Abriendo el panel…</div>`; return; }
  if(!S.entrado){ app.innerHTML=portada(); conectar(); return; }
  let c='';
  if(S.vista==='admin') c=S.abierto?await vistaAdmin():candado();
  else c=await vistaSector(S.vista);
  app.innerHTML=barra()+c+(S.ctrlEdit?panelCarga():'')+(S.avisoAbierto?panelAviso():'');
  conectar();
}

function tomarBorrador(){
  if(!(S.vista==='admin'&&S.tab==='manual')) return;
  const v={};
  document.querySelectorAll('#app input[data-grupo]').forEach(i=>{
    if(i.value==='') return; const g=i.dataset.grupo; v[g]=v[g]||{}; v[g][i.dataset.id]=numero(i.value);
  });
  const tk=document.querySelector('#app input[data-solo="tickets"]');
  if(tk&&tk.value!=='') v.tickets=numero(tk.value);
  S.borrador={k:`${S.cargaSec}|${S.cargaFecha}|${S.cargaTurno}`,v};
}

function conectar(){
  const q=s=>document.querySelector('#app '+s);
  document.querySelectorAll('#app .nav button').forEach(b=>b.onclick=async()=>{
    tomarBorrador(); S.vista=b.dataset.vista; await render(); window.scrollTo({top:0,behavior:'instant'});
  });
  document.querySelectorAll('#app [data-sub]').forEach(b=>b.onclick=async()=>{ S.sub=b.dataset.sub; await render(); });
  document.querySelectorAll('#app [data-tab]').forEach(b=>b.onclick=async()=>{
    tomarBorrador(); S.tab=b.dataset.tab; S.adjunto=null; S.menuAbierto=false;
    S.grupoAbierto=grupoTab(b.dataset.tab); await render();
    window.scrollTo({top:0,behavior:'instant'});
  });
  document.querySelectorAll('#app .mtit[data-grupo]').forEach(b=>b.onclick=async()=>{
    const g=b.dataset.grupo;
    S.grupoAbierto=(S.grupoAbierto===g)?null:g;
    await render();
  });
  const am=q('#abremenu');
  if(am){
    const lat=document.querySelector('#app .lateral');
    if(S.menuAbierto) lat.classList.add('abierta');
    am.onclick=()=>{ S.menuAbierto=!S.menuAbierto; lat.classList.toggle('abierta',S.menuAbierto); };
  }
  // ---- sincronización ----
  const leerSync=async()=>{
    const u=q('#sy-url'), k=q('#sy-clave');
    if(!u) return await Sync.conf();
    const a=q('#sy-auto');
    const c={url:u.value.trim(),clave:k.value.trim(),activo:true,auto:a?a.value==='1':true};
    await Sync.guardarConf(c); return c;
  };
  const sya=q('#sy-auto');
  if(sya) sya.onchange=async()=>{ const c=await leerSync();
    marcarSync(c.auto?'aldia':'off');
    toast(c.auto?'Sincronización automática activada':'Sincronización manual'); await render(); };
  const syc=q('#sy-copiar');
  if(syc) syc.onclick=async()=>{
    const el=q('#sy-link'); if(!el) return;
    el.select();
    try{ await navigator.clipboard.writeText(el.value); toast('Link copiado'); }
    catch(e){ try{ document.execCommand('copy'); toast('Link copiado'); }
      catch(e2){ toast('Copialo a mano del cuadro de arriba'); } }
  };
  const syp=q('#sy-probar');
  if(syp) syp.onclick=async()=>{
    const c=await leerSync();
    if(!c.url){ toast('Falta la dirección'); q('#sy-url').focus(); return; }
    syp.disabled=true; syp.textContent='Probando…';
    try{
      const r=await Sync.llamar('ping');
      S.syncEstado={ok:true,msg:`Conectado. La hoja "${r.hoja}" tiene ${nf(r.filas)} registros.`};
    }catch(e){ S.syncEstado={ok:false,msg:'No conectó: '+((e&&e.message)||'error')}; }
    syp.disabled=false; syp.textContent='Probar la conexión'; await render();
  };
  const sys=q('#sy-subir');
  if(sys) sys.onclick=async()=>{
    const c=await leerSync();
    if(!c.url){ toast('Configurá la conexión primero'); return; }
    sys.disabled=true; sys.textContent='Subiendo…';
    try{
      const r=await Sync.subir();
      S.syncEstado={ok:true,msg:`Subidos ${nf(r.escritas)} registros a la planilla.`};
    }catch(e){ S.syncEstado={ok:false,msg:'No se pudo subir: '+((e&&e.message)||'error')}; }
    sys.disabled=false; sys.textContent='Subir lo de esta computadora a la planilla'; await render();
  };
  const syb=q('#sy-bajar');
  if(syb) syb.onclick=async()=>{
    const c=await leerSync();
    if(!c.url){ toast('Configurá la conexión primero'); return; }
    syb.disabled=true; syb.textContent='Trayendo…';
    try{
      const r=await Sync.bajar();
      S.syncEstado={ok:true,msg:`Traídos ${nf(r.n)} registros de la planilla.`};
    }catch(e){ S.syncEstado={ok:false,msg:'No se pudo traer: '+((e&&e.message)||'error')}; }
    syb.disabled=false; syb.textContent='Traer lo de la planilla a esta computadora'; await render();
  };

  // ---- reportes de Boxes ----
  const bxa=q('#bx-arch');
  if(bxa) bxa.onchange=async()=>{
    const fs=[...(bxa.files||[])]; if(!fs.length) return;
    bxa.closest('label').querySelector('strong').textContent='Leyendo…';
    try{
      const juntos={meses:{},total:0,saltadas:0};
      for(const f of fs){
        const r=leerReporteBoxes(await filasDeExcel(f),f.name);
        if(r.error) throw new Error(r.error);
        juntos.total+=r.total; juntos.saltadas+=r.saltadas;
        for(const [ym,x] of Object.entries(r.meses)){
          if(!juntos.meses[ym]) juntos.meses[ym]={dias:{},n:0};
          for(const [d,lista] of Object.entries(x.dias)){
            juntos.meses[ym].dias[d]=(juntos.meses[ym].dias[d]||[]).concat(lista);
          }
          juntos.meses[ym].n+=x.n;
        }
      }
      S.previaBoxes=juntos;
    }catch(e){ S.previaBoxes={error:(e&&e.message)||'no se pudo leer'}; }
    await render();
  };
  const bxc=q('#bx-confirmar');
  if(bxc) bxc.onclick=async()=>{
    const p=S.previaBoxes; if(!p||!p.meses) return;
    bxc.disabled=true; bxc.textContent='Cargando…';
    const r=await rollBoxes();
    for(const [ym,x] of Object.entries(p.meses)){
      if(await guardar('boxes:'+ym,{dias:x.dias})){
        S.bx['boxes:'+ym]={dias:x.dias};
        const s=resumenBoxes(x.dias);
        r[ym]={n:s.n,porTipo:s.porTipo,porCanal:s.porCanal};
      }
    }
    await guardar('boxes:roll',r); S.bxRoll=r;
    const ms=Object.keys(p.meses).sort();
    S.filtro.bxserv={a:ms[ms.length-1].slice(0,4),m:ms[ms.length-1].slice(5,7)};
    S.previaBoxes=null;
    toast(nf(p.total)+' servicios cargados'); await render();
  };
  const bxx=q('#bx-cancelar'); if(bxx) bxx.onclick=async()=>{ S.previaBoxes=null; await render(); };
  document.querySelectorAll('#app [data-bxdel]').forEach(b=>b.onclick=async()=>{
    const ym=b.dataset.bxdel, r=await rollBoxes();
    delete r[ym]; delete S.bx['boxes:'+ym];
    await guardar('boxes:'+ym,{dias:{}});
    if(await guardar('boxes:roll',r)){ S.bxRoll=r; S.filtro.bxserv=null; toast(nombreMes(ym)+' quitado'); await render(); }
  });
  const oba=q('#objBAnio'); if(oba) oba.onchange=async()=>{ S.objBAnio=oba.value; await render(); };
  const obm=q('#objBMes');  if(obm) obm.onchange=async()=>{ S.objBMes=obm.value; await render(); };
  const gob=q('#guardarObjB');
  if(gob) gob.onclick=async()=>{
    const o=await admin('objetivos-boxes',{});
    const ym=`${S.objBAnio||hoyISO().slice(0,4)}-${S.objBMes||hoyISO().slice(5,7)}`;
    const reg={}; let algo=false;
    document.querySelectorAll('#app input[data-objb]').forEach(i=>{
      const v=numero(i.value); if(!v) return;
      reg[i.dataset.objb]=reg[i.dataset.objb]||{};
      reg[i.dataset.objb][i.dataset.q]=v; algo=true;
    });
    if(!algo){ toast('Cargá al menos un objetivo'); return; }
    o[ym]=reg;
    if(await guardar('admin:objetivos-boxes',o)){ toast('Objetivo guardado'); await render(); }
  };
  const bob=q('#borrarObjB');
  if(bob) bob.onclick=async()=>{
    const o=await admin('objetivos-boxes',{});
    delete o[`${S.objBAnio||hoyISO().slice(0,4)}-${S.objBMes||hoyISO().slice(5,7)}`];
    if(await guardar('admin:objetivos-boxes',o)){ toast('Objetivo borrado'); await render(); }
  };
  const glu=q('#guardarLubri');
  if(glu) glu.onclick=async()=>{
    const L=await litrosLubri();
    const ym=`${S.objBAnio||hoyISO().slice(0,4)}-${S.objBMes||hoyISO().slice(5,7)}`;
    const v=numero(q('#lub-lit').value);
    if(v) L[ym]=v; else delete L[ym];
    if(await guardar('boxes:lubricante',L)){ S.lubri=L; toast(v?nf(v)+' L guardados':'Litros borrados'); await render(); }
  };
  document.querySelectorAll('#app [data-lubdel]').forEach(b=>b.onclick=async()=>{
    const L=await litrosLubri(); delete L[b.dataset.lubdel];
    if(await guardar('boxes:lubricante',L)){ S.lubri=L; toast('Quitado'); await render(); }

      tip.style.display='block';
      const g=wrap.getBoundingClientRect(), c=col.getBoundingClientRect();
      let x=c.left-g.left+c.width/2-tip.offsetWidth/2;
      x=Math.max(4,Math.min(x,g.width-tip.offsetWidth-4));

      const cont=el.closest('label'); const t=cont.querySelector('strong'); t.textContent='Procesando…';
      try{ S.adjunto=await prepararAdjunto(f); await render(); }
      catch(e){ t.textContent='Adjuntar comprobante'; toast((e&&e.message)||'No se pudo adjuntar'); }
    };
  });
  const qa=q('#quitarAdjunto'); if(qa) qa.onclick=async()=>{ S.adjunto=null; await render(); };
  document.querySelectorAll('#app [data-ver]').forEach(b=>b.onclick=()=>verAdjunto(b.dataset.ver));
  const gr=q('#guardarRemito');
  if(gr) gr.onclick=async()=>{
    const lista=await admin('remitos',[]); const rem=numero(q('#rm-lr').value);
    if(!rem){ toast('Faltan los litros remitidos'); q('#rm-lr').focus(); return; }
    const adj=S.adjunto;
    if(adj && !await guardar('arch:'+adj.id,adj.datos)){ toast('No se pudo guardar el adjunto'); return; }
    lista.unshift({fecha:q('#rm-f').value||hoyISO(),numero:q('#rm-n').value.trim(),producto:q('#rm-p').value,
      remitidos:rem,medidos:numero(q('#rm-lm').value),patente:q('#rm-pat').value.trim().toUpperCase(),
      transportista:q('#rm-tr').value.trim(),
      archivo:adj?{id:adj.id,nombre:adj.nombre,tipo:adj.tipo,peso:adj.peso}:null});
    S.adjunto=null;
    if(await guardar('admin:remitos',lista)){ toast('Remito guardado'); await render(); }
    else { lista.shift(); toast('No se pudo guardar el remito'); }
  };
  document.querySelectorAll('#app [data-facsec]').forEach(b=>b.onclick=async()=>{
    S.facSec=b.dataset.facsec; S.facProv='todos'; S.facSel={}; S.adjunto=null; await render();
  });
  const selGasto=q('#gastoMes'); if(selGasto) selGasto.onchange=async()=>{ S.gastoMes=selGasto.value; await render(); };
  const selGas=q('#gasMes'); if(selGas) selGas.onchange=async()=>{ S.gasMes=selGas.value; await render(); };
  const fmes=q('#facMes'); if(fmes) fmes.onchange=async()=>{ S.facMes=fmes.value; await render(); };
  document.querySelectorAll('#app [data-facsel]').forEach(c=>c.onchange=async()=>{
    S.facSel[c.dataset.facsel]=c.checked; await render();
  });
  const fnada=q('#fc-nada'); if(fnada) fnada.onclick=async()=>{ S.facSel={}; await render(); };
  const msel=q('#fc-m');
  if(msel) msel.onchange=()=>{
    const w=q('#fc-motro-wrap');
    w.style.display=msel.value==='__otro'?'':'none';
    if(msel.value==='__otro') q('#fc-motro').focus();
  };
  const gex=q('#gas-excel');
  if(gex) gex.onclick=async()=>{
    const lista=await admin('facturas',[]);
    const fs=lista.filter(f=>(f.fecha||'').slice(0,7)===S.gasMes);
    const ws=XLSX.utils.aoa_to_sheet([
      ['Fecha','Proveedor','Sector','Tipo','Numero','Detalle','Medio de pago','Fecha de pago','Vencimiento','Importe','Estado'],
      ...fs.slice().sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||'')).map(f=>[
        f.fecha||'',f.proveedor||'',nomSect(f.sector||'admin'),f.tipo||'',f.numero||'',
        f.detalle||'',f.medio||'',f.pagada||'',f.vence||'',Number(f.importe)||0,f.estado||''])
    ]);
    ws['!cols']=[{wch:11},{wch:22},{wch:15},{wch:6},{wch:18},{wch:26},{wch:20},{wch:12},{wch:12},{wch:14},{wch:11}];
    const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Gastos');
    XLSX.writeFile(wb,`gastos-${S.gasMes}.xlsx`);
    toast('Detalle descargado');
  };
  document.querySelectorAll('#app [data-provdel]').forEach(b=>b.onclick=async()=>{
    const p=b.dataset.provdel, sec=S.facSec||'boxes';
    const g=await admin('proveedores',{});
    if((g[sec]||[]).includes(p)){                       // agregado por vos: se saca de la lista
      g[sec]=g[sec].filter(x=>x!==p);
      await guardar('admin:proveedores',g); S.admin.proveedores=g;
    } else {                                            // viene de fábrica: se oculta
      const o=await admin('proveedores-ocultos',{});
      o[sec]=[...new Set([...(o[sec]||[]),p])];
      await guardar('admin:proveedores-ocultos',o); S.admin['proveedores-ocultos']=o;
    }
    if(S.facProv===p) S.facProv='todos';
    toast(p+' quitado'); await render();
  });
  const ctg=q('#ct-guardar');
  if(ctg) ctg.onclick=async()=>{
    const CT=await contactos(), p=S.facProv;
    CT[p]={nombre:q('#ct-nom').value.trim(),mail:q('#ct-mail').value.trim(),tel:q('#ct-tel').value.trim()};
    if(await guardar('admin:contactos',CT)){ S.contactos=CT; toast('Contacto guardado'); await render(); }
  };
  const fav=q('#fc-aviso');
  if(fav) fav.onclick=async()=>{
    const lista=await admin('facturas',[]), CT=await contactos();
    const facs=Object.keys(S.facSel).filter(k=>S.facSel[k]).map(i=>lista[Number(i)]).filter(Boolean);
    if(!facs.length){ toast('Marcá al menos una factura'); return; }
    const prov=facs[0].proveedor;
    const a=avisoPago(prov,facs,CT[prov]);
    S.avisoAbierto={prov,...a,nombre:(CT[prov]||{}).nombre||'',
      mail:(CT[prov]||{}).mail||'',tel:(CT[prov]||{}).tel||''};
    await render();
  };
  const cerrarAv=async()=>{ S.avisoAbierto=null; await render(); };
  const fa1=document.getElementById('cerrarAviso'); if(fa1) fa1.onclick=cerrarAv;
  const fa2=document.getElementById('cerrarAvisoX'); if(fa2) fa2.onclick=cerrarAv;
  const avc=document.getElementById('av-copiar');
  if(avc) avc.onclick=async()=>{
    const t=document.getElementById('av-cuerpo').value;
    try{ await navigator.clipboard.writeText(t); toast('Mensaje copiado'); }
    catch(e){ document.getElementById('av-cuerpo').select();
      try{ document.execCommand('copy'); toast('Mensaje copiado'); }catch(e2){ toast('Copialo a mano'); } }
  };
  ['av-mail','av-wa'].forEach(id=>{
    const el=document.getElementById(id); if(!el) return;
    el.onclick=e=>{
      const cuerpo=document.getElementById('av-cuerpo').value;
      const asunto=document.getElementById('av-asunto').value;
      if(id==='av-mail'){
        el.href=`mailto:${encodeURIComponent(S.avisoAbierto.mail||'')}?subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(cuerpo)}`;
      }else{
        const t=telWA(S.avisoAbierto.tel||'');
        if(t.length<12){ e.preventDefault(); toast('Falta el teléfono del proveedor'); return; }
        el.href=`https://wa.me/${t}?text=${encodeURIComponent(cuerpo)}`;
      }
    };
  });
  const fpv=q('#facProv'); if(fpv) fpv.onchange=async()=>{ S.facProv=fpv.value; await render(); };
  const fsel=q('#fc-p');
  if(fsel) fsel.onchange=()=>{
    const w=q('#fc-otro-wrap');
    w.style.display=fsel.value==='__otro'?'':'none';
    if(fsel.value==='__otro') q('#fc-otro').focus();
  };
  document.querySelectorAll('#app [data-pagar]').forEach(b=>b.onclick=async()=>{
    const lista=await admin('facturas',[]), i=Number(b.dataset.pagar);
    if(!lista[i]) return;
    lista[i].estado='pagada'; lista[i].pagada=hoyISO();
    if(await guardar('admin:facturas',lista)){ toast('Marcada como pagada'); await render(); }
  });
  const gf=q('#guardarFactura');
  if(gf) gf.onclick=async()=>{
    const lista=await admin('facturas',[]);
    const imp=numero(q('#fc-i').value);
    if(!imp){ toast('Falta el importe'); q('#fc-i').focus(); return; }
    let prov=q('#fc-p')?q('#fc-p').value:'';
    if(prov==='__otro'){
      prov=q('#fc-otro').value.trim();
      if(!prov){ toast('Escribí el nombre del proveedor'); q('#fc-otro').focus(); return; }
    }
    const sec=S.facSec||'boxes';
    const adjF=S.adjunto;
    if(adjF && !await guardar('arch:'+adjF.id,adjF.datos)){ toast('No se pudo guardar el adjunto'); return; }
    let medio=q('#fc-m')?q('#fc-m').value:'';
    if(medio==='__otro') medio=q('#fc-motro').value.trim();
    lista.unshift({sector:sec,proveedor:prov,fecha:q('#fc-f').value||hoyISO(),vence:q('#fc-v').value,
      tipo:q('#fc-t').value,numero:q('#fc-n').value.trim(),detalle:q('#fc-d').value.trim(),
      medio,pagada:q('#fc-fp')?q('#fc-fp').value:'',
      importe:imp,estado:q('#fc-e').value,
      archivo:adjF?{id:adjF.id,nombre:adjF.nombre,tipo:adjF.tipo,peso:adjF.peso}:null});
    S.adjunto=null;
    if(await guardar('admin:facturas',lista)){
      // recuerda proveedores nuevos para la próxima
      if(!(PROV_DEF[sec]||[]).includes(prov)){
        const g=await admin('proveedores',{});
        g[sec]=[...new Set([...(g[sec]||[]),prov])];
        await guardar('admin:proveedores',g); S.admin.proveedores=g;
      }
      toast('Factura guardada'); await render();
    } else { lista.shift(); toast('No se pudo guardar la factura'); }
  };
  document.querySelectorAll('#app [data-borrar]').forEach(b=>b.onclick=async()=>{
    const k=b.dataset.borrar, lista=await admin(k,[]);
    const fuera=lista[Number(b.dataset.i)];
    if(fuera&&fuera.archivo) await guardar('arch:'+fuera.archivo.id,null);
    lista.splice(Number(b.dataset.i),1);
    if(await guardar('admin:'+k,lista)){ S.admin[k]=lista; toast('Eliminado'); await render(); }
  });
  const br=q('#bajarRespaldo');
  if(br) br.onclick=async()=>{
    const datos={};
    for(const k of await Alm.claves()){ if(k==='diagnostico') continue; const v=await Alm.get(k); if(v!=null) datos[k]=v; }
    const blob=new Blob([JSON.stringify({app:'panel-estacion',version:1,fecha:new Date().toISOString(),datos},null,1)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=`respaldo-estacion-${hoyISO()}.json`;
    a.click(); URL.revokeObjectURL(a.href);
    toast('Respaldo descargado');
  };
  const sr=q('#subirRespaldo');
  if(sr) sr.onchange=async()=>{
    const f=sr.files&&sr.files[0]; if(!f) return;
    try{
      const j=JSON.parse(await f.text());
      if(!j.datos) throw new Error('el archivo no tiene datos de la app');
      let n=0;
      for(const [k,v] of Object.entries(j.datos)){ await Alm.set(k,v); n++; }
      S.ops={}; S.roll={}; S.admin={}; S.previa=null;
      S.cfg={...CONFIG_DEF,...(await leer('config',{})),combustibles:CONFIG_DEF.combustibles,turnos:CONFIG_DEF.turnos};
      toast(n+' registros restaurados'); await render();
    }catch(e){ S.diag={ok:false,msg:'No se pudo restaurar: '+((e&&e.message)||String(e))}; await render(); }
  };
  const pg=q('#probarGuardado');
  if(pg) pg.onclick=async()=>{
    pg.disabled=true; pg.textContent='Probando…';
    const marca='prueba-'+Date.now();
    let msg='', ok=false;
    try{
      await Alm.set('diagnostico',JSON.stringify({marca}));
      const v=await leer('diagnostico',null);
      if(v&&v.marca===marca){ ok=true; msg='Responde bien (modo: '+Alm.modo+'). Escribió y leyó de vuelta.'; }
      else msg='Escribió pero al leer volvió algo distinto (modo: '+Alm.modo+').';
    }catch(e){ msg='Falló: '+((e&&e.message)||String(e)); }
    S.diag={ok,msg}; await render();
  };
  const gcf=q('#guardarConfig');
  if(gcf) gcf.onclick=async()=>{
    S.cfg.estacion=q('#cf-n').value.trim()||'Mi Estación';
    S.cfg.clave=q('#cf-c').value.trim()||'Ingreso01';
    S.cfg.claveEntrada=q('#cf-e').value.trim()||'2026';
    if(await guardar('config',S.cfg)){ toast('Guardado'); await render(); }
  };
}

/* ---------- arranque ---------- */
async function sembrar(forzar){
  if(Sync.servido&&!forzar) return;      // servido: los datos vienen de la planilla
  if(!forzar&&await leer('semilla:enero',false)) return;
  let todoOk=true;
  for(const [k,v] of Object.entries(SEMILLA.ops)){
    const act=await leer(k,null);
    if(act&&Object.keys(act).length) continue;
    S.ops[k]=v;                                  // disponible en esta sesión pase lo que pase
    if(!await guardar(k,v)) todoOk=false;
  }
  const r=await leer('roll:playa',{});
  for(const [ym,v] of Object.entries(SEMILLA.roll)) if(!r[ym]) r[ym]=v;
  S.roll.playa=r;
  if(!await guardar('roll:playa',r)) todoOk=false;
  if(todoOk) await guardar('semilla:enero',true);
}
(async function iniciar(){
  S.cfg=await leer('config',null);
  if(!S.cfg){ S.cfg=CONFIG_DEF; await guardar('config',S.cfg); }
  else S.cfg={...CONFIG_DEF,...S.cfg,combustibles:CONFIG_DEF.combustibles,turnos:CONFIG_DEF.turnos};
  if(S.cfg.clave==='1234'){ S.cfg.clave='Ingreso01'; await guardar('config',S.cfg); }
  if(!S.cfg.claveEntrada||S.cfg.claveEntrada==='Ingreso01'){ S.cfg.claveEntrada='2026'; await guardar('config',S.cfg); }
  try{ await sembrar(); }catch(e){ console.warn('semilla',e); }
  if(Sync.servido){
    marcarSync('bajando');
    const listo=await Sync.esperarPuente(12000);
    if(!listo) marcarSync('error','Google no habilitó la conexión. Recargá la página.');
    else {
      try{
        const r=await Sync.bajar();
        // planilla vacía la primera vez: deja los eneros que trae el archivo y los sube
        if(!r.n){
          await sembrar(true);
          await Sync.vaciarCola();
        }
        marcarSync('aldia');
      }
      catch(e){ marcarSync('error',(e&&e.message)||''); }
    }
  } else {
    const sc=await Sync.conf();
    if(sc.url&&sc.auto!==false){
      marcarSync('bajando');
      try{ await Sync.bajar(); marcarSync('aldia'); }
      catch(e){ marcarSync('error',(e&&e.message)||''); }
    }
  }
  const r=await roll('playa'); const ms=Object.keys(r).sort();
  if(ms.length) S.mes=ms[ms.length-1];
  S.cargando=false;
  await render();
})();
</script>
