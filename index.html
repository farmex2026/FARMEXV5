<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

html,body{margin:0;padding:0;background:#070A12;min-height:100%}
body{overscroll-behavior:none}
:root{
  --concreto:#070A12; --panel:#0E1422; --panel-2:#131B2C;
  --petroleo:#0C1830; --petroleo-2:#080E1C;
  --tinta:#E6EDF8; --tinta-suave:#8496B4;
  --linea:#22304D; --linea-2:#1A2338;
  --cian:#22E3F5; --cian-suave:#8FF0FB; --violeta:#9D7CFF; --violeta-2:#6D4BE0;
  --ambar:#22E3F5; --alerta:#FF6B85; --ok:#3DE0A0; --r:3px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
#app{background:var(--concreto);color:var(--tinta);font-family:'Archivo',system-ui,sans-serif;
  font-size:15px;line-height:1.45;min-height:100vh;padding-bottom:60px;margin:0;
  box-sizing:border-box;
  background-image:linear-gradient(rgba(34,227,245,.028) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(34,227,245,.028) 1px,transparent 1px);
  background-size:44px 44px,44px 44px}
#app *{font-family:inherit}
h1,h2,h3,.cond{font-family:'Barlow Condensed','Archivo',sans-serif;text-transform:uppercase;letter-spacing:.045em;font-weight:700;margin:0}
.num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-weight:500}

.top{background:var(--petroleo);color:var(--tinta);padding:12px 14px 0;position:sticky;top:0;z-index:20;
  border-bottom:1px solid var(--cian);box-shadow:0 0 22px rgba(45,212,232,.16);position:sticky}
.top::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(90deg,transparent,transparent 3px,rgba(45,212,232,.045) 3px,rgba(45,212,232,.045) 4px)}
.top-fila,.nav{position:relative}
.top-fila{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.marca{font-size:19px;line-height:1;color:var(--tinta);text-shadow:0 0 14px rgba(45,212,232,.5)}
.marca span{color:var(--cian);text-shadow:0 0 12px var(--cian)}
.fecha-hoy{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--cian);white-space:nowrap;
  display:flex;align-items:center;gap:9px;justify-content:flex-end}
.chip-sync{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.12em;padding:2px 7px;
  border-radius:9px;border:1px solid;white-space:nowrap}
.chip-sync.aldia{color:var(--ok);border-color:rgba(61,224,160,.4);background:rgba(61,224,160,.08)}
.chip-sync.subiendo,.chip-sync.bajando,.chip-sync.pendiente{color:var(--cian);border-color:rgba(34,227,245,.4);background:rgba(34,227,245,.08)}
.chip-sync.error{color:var(--alerta);border-color:rgba(255,107,133,.45);background:rgba(255,107,133,.1)}
.nav{display:flex;gap:2px;overflow-x:auto;margin-top:11px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{background:transparent;border:0;border-bottom:3px solid transparent;color:#6B84AD;
  padding:9px 12px 8px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;
  cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:15px}
.nav button{transition:color .14s ease}
.nav button:hover{color:var(--cian-suave)}
.nav button[aria-current="true"]{color:var(--cian);border-bottom-color:var(--cian);
  text-shadow:0 0 12px rgba(34,227,245,.55)}
@media (prefers-reduced-motion:reduce){.nav button{transition:none}}

.envoltorio{padding:14px 12px 0;max-width:900px;margin:0 auto}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--cian);font-weight:500;margin-bottom:8px;opacity:.85}
.tarjeta{background:var(--panel);border:1px solid var(--linea-2);border-radius:var(--r);padding:13px;margin-bottom:12px;
  position:relative;overflow:hidden}
.tarjeta::before{content:'';position:absolute;top:0;left:0;width:26px;height:1px;background:var(--cian);opacity:.75}
.tarjeta::after{content:'';position:absolute;top:0;left:0;width:1px;height:26px;background:var(--cian);opacity:.75}
.tarjeta > h2{font-size:17px;margin-bottom:2px;letter-spacing:.06em}
.sub{font-size:12.5px;color:var(--tinta-suave);margin:0 0 11px}

.totem{background:var(--petroleo-2);border-radius:var(--r);padding:12px 13px 13px;margin-bottom:12px;
  border:1px solid var(--linea);border-left:2px solid var(--cian);position:relative;overflow:hidden}
.totem::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:.6;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(34,227,245,.02) 2px,rgba(34,227,245,.02) 3px)}
.totem-cab,.linea-totem,.totem-total,.totem-vacio{position:relative;z-index:1}
.totem-cab{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--linea);padding-bottom:7px;margin-bottom:4px}
.totem-cab .t{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.14em;font-size:13px;color:var(--cian);font-weight:600}
.totem-cab .d{font-size:11px;color:var(--tinta-suave);font-family:'IBM Plex Mono',monospace}
.linea-totem{display:flex;align-items:baseline;gap:7px;padding:5px 0}
.linea-totem .chip{width:4px;height:15px;border-radius:1px;flex:0 0 auto;align-self:center}
.linea-totem .nom{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.05em;font-size:15.5px;color:var(--tinta);font-weight:600;white-space:nowrap}
.linea-totem .guia{flex:1;border-bottom:1px dotted #24365A;min-width:14px;transform:translateY(-3px)}
.linea-totem .val{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:17px;color:var(--tinta);font-weight:600;white-space:nowrap}
.linea-totem .val i{font-style:normal;font-size:10.5px;color:var(--cian);margin-left:3px;letter-spacing:.05em}
.totem-total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--linea);margin-top:6px;padding-top:8px}
.totem-total .nom{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:14px;color:var(--cian);font-weight:700}
.totem-total .val{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:23px;color:var(--cian-suave);font-weight:600;text-shadow:0 0 14px rgba(34,227,245,.45)}
.totem-total .val i{font-style:normal;font-size:11px;margin-left:3px}
.totem-vacio{color:var(--tinta-suave);font-size:12.5px;padding:12px 0 4px;text-align:center;line-height:1.5}

.turnos{display:flex;gap:5px;margin-bottom:12px}
.turnos button{flex:1;background:var(--panel);border:1px solid var(--linea);border-radius:var(--r);
  padding:8px 4px;cursor:pointer;text-align:center;color:var(--tinta-suave)}
.turnos button strong{display:block;font-family:'Barlow Condensed',sans-serif;font-size:15px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.turnos button small{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;margin-top:1px;opacity:.85}
.turnos button[aria-pressed="true"]{background:var(--cian);border-color:var(--cian);color:#061018}
.turnos button[aria-pressed="true"] small{color:#0A2E36}
.turnos button.cargado::after{content:'';display:block;width:5px;height:5px;border-radius:50%;background:var(--ok);margin:4px auto 0}
.turnos button[aria-pressed="true"].cargado::after{background:#05121A}

.campo{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--linea-2)}
.campo:last-child{border-bottom:0}
.campo .chip{width:4px;height:20px;border-radius:1px;flex:0 0 auto}
.campo label{flex:1;font-size:14px;font-weight:500}
select{appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--cian) 50%),linear-gradient(135deg,var(--cian) 50%,transparent 50%);
  background-position:calc(100% - 15px) center,calc(100% - 10px) center;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:28px}
input,select{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:15px;
  border:1px solid var(--linea);border-radius:var(--r);padding:8px 9px;background:#080D18;color:var(--tinta);width:100%}
input::placeholder{color:#4A5D80}
select option{background:#0E1422;color:var(--tinta)}
input[type=number],input.n{text-align:right;width:112px;flex:0 0 auto;font-family:'IBM Plex Mono',monospace}
.rejilla input.n{width:100%}
input[type=text],input[type=date],input[type=month],select{font-family:'Archivo',sans-serif}
input:focus-visible,select:focus-visible,button:focus-visible,label.archivo:focus-within{outline:2px solid var(--ambar);outline-offset:1px}
.unidad{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--tinta-suave);width:16px;flex:0 0 auto}
.rejilla{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.rejilla label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-suave);font-weight:600;margin-bottom:3px}
.rejilla .ancho{grid-column:1/-1}

.btn{width:100%;background:var(--cian);border:0;border-radius:var(--r);padding:13px;
  font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:#04131A;cursor:pointer;margin-top:11px;
  box-shadow:0 0 18px rgba(45,212,232,.28)}
.btn{transition:box-shadow .15s ease,transform .1s ease}
.btn:hover{box-shadow:0 0 26px rgba(34,227,245,.42)}
a.btn{display:block;text-align:center;text-decoration:none;box-sizing:border-box}
a.btn.inhabilitado{opacity:.5;pointer-events:none}
.btn:active{transform:translateY(1px)}
.btn.sec:hover{border-color:var(--cian);color:var(--cian-suave);box-shadow:none}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
.btn.sec{background:transparent;border:1px solid var(--linea);color:var(--tinta);font-size:15px;padding:10px;box-shadow:none}
.btn:disabled{opacity:.5;cursor:default}
label.archivo{display:block;width:100%;background:transparent;border:1px dashed var(--linea);border-radius:var(--r);
  padding:19px 13px;text-align:center;cursor:pointer;margin-top:4px}
label.archivo strong{display:block;font-family:'Barlow Condensed',sans-serif;font-size:17px;letter-spacing:.07em;text-transform:uppercase}
label.archivo small{display:block;font-size:12px;color:var(--tinta-suave);margin-top:2px}
label.archivo input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
textarea{width:100%;font-family:'IBM Plex Mono',monospace;font-size:13px;border:1px solid var(--linea);
  border-radius:var(--r);padding:9px;background:#080D18;color:var(--tinta);resize:vertical}
label.archivo.chico{padding:12px 13px;margin-top:9px}
label.archivo.chico strong{font-size:15px}
.adj{display:flex;align-items:center;gap:9px;margin-top:9px;padding:9px 11px;background:var(--panel-2);border:1px solid var(--linea);border-radius:var(--r)}
.adj .ic{color:var(--tinta-suave);display:flex;flex:0 0 auto}
.adj .cuerpo{flex:1;min-width:0}
.adj .t1{display:block;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adj .t2{display:block;font-size:11.5px;color:var(--tinta-suave);font-family:'IBM Plex Mono',monospace}
.ver{background:transparent;border:1px solid var(--linea);border-radius:2px;color:var(--tinta);cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.07em;font-size:12.5px;font-weight:600;padding:3px 8px;margin-top:3px}

.scroll{overflow-x:auto;margin:0 -13px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--linea-2);color:var(--tinta)}
th{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--cian);border-bottom:1px solid var(--linea);font-weight:500;opacity:.85}
td:first-child,th:first-child{text-align:left;padding-left:13px}
td:last-child,th:last-child{padding-right:13px}
td.num,th.num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
td.falta{color:var(--tinta-suave)}
tr.tot td{border-top:1px solid var(--cian);border-bottom:0;font-weight:700;background:var(--panel-2);color:var(--tinta)}
.vacio{text-align:center;color:var(--tinta-suave);font-size:13px;padding:22px 10px;line-height:1.6}

/* ---- contadores tipo tablero ---- */
.anios{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:12px}
@media(min-width:620px){.anios{grid-template-columns:1fr 1fr}}
.anio{background:var(--petroleo-2);border:1px solid var(--linea);border-radius:var(--r);padding:13px}
.anio .rot{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.12em;font-size:12.5px;
  color:var(--cian);font-weight:600;margin-bottom:9px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.anio .pie{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.13em;font-size:11.5px;color:var(--tinta-suave);margin-top:8px}
.digitos{display:flex;gap:3px;align-items:stretch;flex-wrap:wrap}
.dig{background:#050A12;border:1px solid #1B3A4A;border-radius:2px;color:var(--cian-suave);
  font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:23px;line-height:1;padding:7px 6px;
  min-width:23px;text-align:center;text-shadow:0 0 14px rgba(34,227,245,.6)}
.sep{color:var(--tinta-suave);font-family:'IBM Plex Mono',monospace;font-size:20px;align-self:flex-end;padding-bottom:7px}
.insignia{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.06em;font-size:12px;
  font-weight:700;padding:3px 8px;border-radius:11px}
.insignia.baja{background:#2E1412;color:var(--alerta);border:1px solid #4A211C}
.insignia.sube{background:#0C2418;color:var(--ok);border:1px solid var(--ok)}
.tres{display:grid;grid-template-columns:1fr;gap:13px;background:var(--petroleo-2);border-radius:var(--r);padding:13px;margin-top:4px}
@media(min-width:620px){.tres{grid-template-columns:repeat(3,1fr)}}
.tres .rot{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.11em;font-size:11px;color:var(--cian);font-weight:600;margin-bottom:6px}
.tres .dig{font-size:19px;min-width:19px;padding:6px 5px}
.tres .sep{font-size:17px;padding-bottom:6px}

/* ---- gráfico ---- */
.graf{position:relative;overflow-x:auto;overflow-y:visible;margin:0 -13px;padding:0 13px}
.graf-in{display:flex;gap:5px;align-items:flex-end;min-width:470px;
  background:linear-gradient(to top,transparent 21px,var(--linea) 21px,var(--linea) 22px,transparent 22px),
             repeating-linear-gradient(to top,transparent,transparent 45px,var(--linea-2) 45px,var(--linea-2) 46px)}
.col{flex:1;display:flex;flex-direction:column;align-items:center;cursor:default;padding-top:6px;border-radius:2px}
.col:hover,.col:focus-visible,.col.activa{background:rgba(45,212,232,.07);outline:none}
.col.sel{background:rgba(242,168,29,.16);box-shadow:inset 0 -2px 0 var(--cian)}
.col.sel .et{color:var(--tinta)}
.barras{height:158px;display:flex;align-items:flex-end;gap:2px;width:100%;justify-content:center;padding:0 3px}
.b{width:44%;max-width:19px;border-radius:1px 1px 0 0;min-height:1px}
.b1{background:#5B6B8F} .b2{background:var(--cian)}
.col .et{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.06em;
  font-size:12px;color:var(--tinta-suave);font-weight:600;padding:5px 0 3px}
.tip{position:absolute;pointer-events:none;background:#0A1424;border:1px solid var(--cian);color:var(--tinta);border-radius:var(--r);
  padding:8px 11px;font-size:12.5px;box-shadow:0 4px 14px rgba(0,0,0,.28);z-index:30;display:none;white-space:nowrap}
.tip b{display:block;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.08em;font-size:13px;margin-bottom:4px}
.tip .l{display:flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:12px}
.tip .l i{width:8px;height:8px;border-radius:1px;flex:0 0 auto}
.leyenda{display:flex;gap:15px;justify-content:center;margin-top:9px}
.leyenda span{display:flex;align-items:center;gap:6px;font-family:'Barlow Condensed',sans-serif;
  text-transform:uppercase;letter-spacing:.07em;font-size:13px;color:var(--tinta-suave);font-weight:600}
.leyenda i{width:11px;height:11px;border-radius:2px}
.dos{display:grid;grid-template-columns:1fr;gap:0}
@media(min-width:760px){.dos{grid-template-columns:1fr 1fr;gap:12px}.dos .tarjeta{margin-bottom:12px}}

/* ---- barras horizontales por producto ---- */
.hgraf{margin-top:4px}
.hfila{display:grid;grid-template-columns:74px 1fr;gap:9px;align-items:center;margin-bottom:9px}
.hnom{font-size:12.5px;line-height:1.25;text-align:right;color:var(--tinta-suave);font-weight:500}
.hbarras{display:flex;flex-direction:column;gap:3px;border-left:1px solid var(--linea);padding-left:1px}
.hb{display:flex;align-items:center;gap:6px;height:15px}
.hb i{display:block;height:100%;border-radius:0 1px 1px 0;min-width:2px}
.hb em{font-style:normal;font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;color:var(--tinta)}
.heje{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--tinta-suave);
  border-top:1px solid var(--linea);padding-top:3px}
.heje span{transform:translateX(-50%)}
.heje span:first-child{transform:none}
.heje span:last-child{transform:translateX(0)}

/* ---- barras verticales por turno ---- */
.varturnos{display:flex;flex-wrap:wrap;gap:11px;margin-bottom:11px}
.varturnos span{font-size:12.5px}
.varturnos b{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.06em;font-size:13.5px;font-weight:700}
.vgraf-wrap{position:relative}
.vgraf{display:flex;gap:7px}
.vcol{cursor:default;border-radius:2px}
.vcol:hover,.vcol:focus-visible,.vcol.activa{background:rgba(45,212,232,.07);outline:none}
.veje{display:flex;flex-direction:column;justify-content:space-between;height:172px;
  font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--tinta-suave);text-align:right;padding-bottom:20px}
.vcols{flex:1;display:flex;gap:5px;align-items:flex-end;
  background:repeating-linear-gradient(to top,transparent,transparent 37px,var(--linea-2) 37px,var(--linea-2) 38px);
  border-bottom:1px solid var(--linea)}
.vcol{flex:1;display:flex;flex-direction:column;align-items:center}
.vbarras{height:152px;display:flex;align-items:flex-end;justify-content:center;gap:4px;width:100%}
.vb{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;width:38%;max-width:34px}
.vb i{display:block;width:100%;border-radius:1px 1px 0 0;min-height:1px}
.vb em{font-style:normal;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;padding-bottom:2px}
.vet{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.06em;font-size:13px;
  color:var(--tinta-suave);font-weight:600;padding-top:4px}
tr.vig td{background:rgba(34,227,245,.07);font-weight:600;color:var(--tinta)}
td small{display:block;font-size:10.5px;color:var(--tinta-suave);font-weight:400;font-family:'IBM Plex Mono',monospace}
table.obj td{vertical-align:middle}
table.obj td:first-child{white-space:normal;min-width:132px;font-weight:600;font-size:13.5px}
table.obj input.n{width:96px}
.uni{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--tinta-suave);margin-left:5px}
.resu{margin-top:9px;border:1px solid var(--linea);border-radius:var(--r);overflow:hidden;max-height:310px;overflow-y:auto;background:#080D18}
.rfila{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;
  border-bottom:1px solid var(--linea-2);padding:9px 11px;cursor:pointer;font-family:'Archivo',sans-serif}
.rfila:last-child{border-bottom:0}
.rfila:hover,.rfila:focus-visible{background:#111A2C}
.rfila .cuerpo{flex:1;min-width:0}
.rfila .t1{display:block;font-size:13.5px;font-weight:600;color:var(--tinta)}
.rfila .t2{display:block;font-size:11.5px;color:var(--tinta-suave);font-family:'IBM Plex Mono',monospace}
.rfila .pr{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;flex:0 0 auto}

/* Detecta dónde puede guardar: el almacén del visor, el del navegador, o solo memoria. */
const Alm=(()=>{
  const mem={}; const P='est:';
  let ls=null;
  try{ const p='__p'+Date.now(); localStorage.setItem(p,'1'); localStorage.removeItem(p); ls=localStorage; }catch(e){ ls=null; }
  const ws=(typeof window!=='undefined'&&window.storage&&typeof window.storage.set==='function')?window.storage:null;
  const modo=ws?'visor':(ls?'navegador':'memoria');
  return {
    modo,
    async get(k){
      if(ws){ const r=await ws.get(k); return r&&r.value!=null?r.value:null; }
      if(ls) return ls.getItem(P+k);
      return k in mem?mem[k]:null;
    },
    async set(k,txt){
      if(ws){ const r=await ws.set(k,txt); if(!r) throw new Error('el almacén no confirmó la escritura'); return true; }
      if(ls){ ls.setItem(P+k,txt); return true; }
      mem[k]=txt; return true;
    },
    async claves(){
      if(ws){ const r=await ws.list(); return (r&&r.keys)||[]; }
      if(ls){ const o=[]; for(let i=0;i<ls.length;i++){const k=ls.key(i); if(k&&k.indexOf(P)===0) o.push(k.slice(P.length));} return o; }
      return Object.keys(mem);
    }
  };
})();

function leerConfDelLink(){
  try{
    const m=(location.hash||'').match(/[#&]s=([^&]+)/);
    if(!m) return null;
    const j=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,'+').replace(/_/g,'/')))));
    if(!j.u||!j.k) return null;
    return {url:j.u,clave:j.k,auto:true,activo:true};
  }catch(e){ return null; }

const Sync={
  cfg:null,
  async conf(){

        try{ history.replaceState(null,'',location.pathname); }catch(e){} }

  },
  async guardarConf(c){ this.cfg=c; return guardar('sync:conf',c); },
  cola:new Set(), timer:null, enVuelo:false,
  sincronizable(k){ return k.indexOf('sync:')!==0&&k.indexOf('arch:')!==0&&k!=='diagnostico'&&k!=='semilla:enero'; },
  // al traer de la planilla hay que soltar los cachés de boxes también
  // encola una clave y sube en bloque un rato después, para no ir de a una
  anotar(k){
    const c=this.cfg;
    if(!this.sincronizable(k)) return;
    if(!this.servido&&(!c||!c.url||c.auto===false)) return;
    this.cola.add(k);

  },
  async vaciarCola(){
    clearTimeout(this.timer);

    if(this.servido&&!await this.esperarPuente(8000)){ marcarSync('error','sin conexión con la planilla'); return; }
    this.enVuelo=true;
    const claves=[...this.cola]; this.cola.clear();
    marcarSync('subiendo');
    try{
      const cambios={};
      for(const k of claves){ const v=await Alm.get(k); if(v!=null) cambios[k]=v; }
      if(Object.keys(cambios).length) await this.llamar('escribir',{cambios});
      await guardar('sync:ultima',{cuando:new Date().toISOString(),sentido:'subida',n:claves.length});
      marcarSync('aldia');
    }catch(e){
      claves.forEach(k=>this.cola.add(k));       // se reintenta en el próximo guardado
      marcarSync('error',(e&&e.message)||'');
    }
    this.enVuelo=false;
    if(this.cola.size){ clearTimeout(this.timer); this.timer=setTimeout(()=>this.vaciarCola(),6000); }
  },
  // cuando el panel corre dentro de Apps Script hay un canal directo, sin CORS
  get servido(){ return !!(window.__FARMEX__&&window.__FARMEX__.dentro); },
  get dentro(){ return this.servido&&!!(window.google&&window.google.script&&window.google.script.run); },
  // Apps Script instala google.script.run después de cargar la página: hay que esperarlo
  async esperarPuente(ms){
    if(!this.servido) return false;
    const hasta=Date.now()+(ms||10000);
    while(Date.now()<hasta){
      if(this.dentro) return true;
      await new Promise(r=>setTimeout(r,120));
    }
    return false;
  },
  rpc(fn,args){
    return new Promise((res,rej)=>{
      let listo=false;
      const t=setTimeout(()=>{ if(!listo) rej(new Error('la planilla no respondió a tiempo')); },45000);
      google.script.run
        .withSuccessHandler(r=>{ listo=true; clearTimeout(t);
          try{ const j=JSON.parse(r); j.ok?res(j):rej(new Error(j.error||'error en la planilla')); }
          catch(e){ rej(new Error('respuesta inesperada de la planilla')); } })
        .withFailureHandler(e=>{ listo=true; clearTimeout(t);
          rej(new Error((e&&e.message)||'la planilla rechazó el pedido')); })
        [fn].apply(null,args);
    });
  },
  async llamar(accion,extra){
    const c=await this.conf();
    if(this.dentro){
      const k=window.__FARMEX__.clave;
      if(accion==='ping')     return this.rpc('apiPing',[k]);
      if(accion==='leer')     return this.rpc('apiLeer',[k]);
      if(accion==='escribir') return this.rpc('apiEscribir',[k,JSON.stringify((extra&&extra.cambios)||{})]);
      throw new Error('acción no disponible acá: '+accion);
    }
    if(!c.url) throw new Error('falta la dirección del script');
    const r=await fetch(c.url,{
      method:'POST', redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},   // evita el pedido previo de CORS
      body:JSON.stringify({accion,clave:c.clave,...(extra||{})})
    });
    if(!r.ok) throw new Error('el script respondió '+r.status);
    let j;
    try{ j=await r.json(); }
    catch(e){ throw new Error('respuesta inesperada: revisá que la implementación sea "Cualquier persona"'); }
    if(!j.ok){
      const m=String(j.error||'error en la planilla');
      if(/demasiado grande/.test(m))
        throw new Error(m+'. Tu script es una versión vieja: pegá el nuevo y creá otra implementación.');
      throw new Error(m);
    }
    return j;
  },
  // qué claves se sincronizan: todo lo que es dato, no la config local ni los adjuntos
  async clavesPropias(){
    const todas=await Alm.claves();
    return todas.filter(k=>this.sincronizable(k));
  },
  async subir(){
    const cambios={};
    for(const k of await this.clavesPropias()){
      const v=await Alm.get(k); if(v!=null) cambios[k]=v;
    }
    const r=await this.llamar('escribir',{cambios});
    await guardar('sync:ultima',{cuando:new Date().toISOString(),sentido:'subida',n:r.escritas});
    return r;
  },
  async bajar(){
    const r=await this.llamar('leer');
    const datos=r.datos||{}; let n=0;
    for(const [k,v] of Object.entries(datos)){ if(!v) continue; await Alm.set(k,v); n++; }
    this.cola.clear(); clearTimeout(this.timer);
    S.ops={}; S.roll={}; S.admin={}; S.listas=null; S.maestro=null;
    S.bx={}; S.bxRoll=null; S.envases=null; S.lubri=null; S.combos=null; S.cortes=null; S.ctrl=null;
    S.filtro={}; S.cmpAnio=null; S.cmpMes='todos'; S.objVerAnio=null; S.objVerTrim=null;
    const c=await leer('config',null);
    if(c) S.cfg={...CONFIG_DEF,...c,combustibles:CONFIG_DEF.combustibles,turnos:CONFIG_DEF.turnos,
                 tiendaRubros:CONFIG_DEF.tiendaRubros};
    await guardar('sync:ultima',{cuando:new Date().toISOString(),sentido:'bajada',n});
    return {n};
  }
};

async function guardar(k,v,intentos=3){

    try{ await Alm.set(k,txt); S.errorUlt=null; Sync.anotar(k); return true; }

function resumenMes(data,g){
  const porProd={}, porTurno={}; let total=0, tickets=0;
  Object.values(data).forEach(d=>Object.entries(d).forEach(([tid,t])=>{
    tickets+=Number(t.tickets)||0;
    Object.entries(t[g]||{}).forEach(([k,v])=>{
      const n=Number(v)||0;
      porProd[k]=(porProd[k]||0)+n; porTurno[tid]=(porTurno[tid]||0)+n; total+=n;
    });
  }));
  return {total:Math.round(total*100)/100,porProd,porTurno,tickets};
}

const TOPE_ADJ=3*1024*1024;                       // 3 MB por archivo
const leerComoDataURL=f=>new Promise((res,rej)=>{
  const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(new Error('no se pudo leer el archivo')); r.readAsDataURL(f);
});
async function comprimirImagen(f){
  const url=URL.createObjectURL(f);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('imagen ilegible'));i.src=url;});
    const max=1600, k=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement('canvas');
    c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg',0.7);
  } finally { URL.revokeObjectURL(url); }
}
async function prepararAdjunto(f){
  let datos;
  if(/^image\//.test(f.type)) datos=await comprimirImagen(f);
  else if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)) datos=await leerComoDataURL(f);
  else throw new Error('solo PDF o imagen');
  const peso=Math.round(datos.length*0.75);
  if(peso>TOPE_ADJ) throw new Error(`el archivo pesa ${(peso/1048576).toFixed(1)} MB y el tope es 3 MB`);
  return {id:'a'+Date.now()+Math.floor(Math.random()*1000),nombre:f.name,tipo:/^image\//.test(f.type)?'image/jpeg':'application/pdf',peso,datos};
}
async function verAdjunto(id){
  const d=await leer('arch:'+id,null);
  if(!d){ toast('No se encontró el archivo'); return; }
  try{
    const coma=d.indexOf(','), tipo=(d.slice(0,coma).match(/:(.*?);/)||[])[1]||'application/octet-stream';
    const bin=atob(d.slice(coma+1)), u8=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
    const url=URL.createObjectURL(new Blob([u8],{type:tipo}));
    window.open(url,'_blank');
    setTimeout(()=>URL.revokeObjectURL(url),60000);
  }catch(e){ toast('No se pudo abrir'); }
}
const pesoTxt=b=>b>=1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';

    const ult=todos[todos.length-1];

  const tarjetaTurno = porRubro
    ? `<div class="tarjeta">

            <td><span class="chip" style="background:${p.color};display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:7px"></span>${esc(p.nombre)}</td>
            ${turnos.map(t=>`<td class="num">${nf((prodTurno[t.id]||{})[p.id]||0)}</td>`).join('')}
            <td class="num"><strong>${nf(porProd[p.id]||0)}</strong></td></tr>`).join('')}
          </tbody>
          <tfoot><tr class="tot"><td>Tickets</td>
            ${turnos.map(t=>`<td class="num">${nf(jornadas.reduce((a,j)=>a+((j.turnos[t.id]||{}).tickets||0),0))}</td>`).join('')}
            <td class="num">${nf(tickets)}</td></tr></tfoot>
        </table></div>
      </div>`
    : `<div class="tarjeta">
        <h2>Por turno</h2>
        <p class="sub">Total de ${esc(rotulo.toLowerCase())} en cada turno.</p>
        ${turnos.map(t=>`<div class="campo"><span class="ic" style="color:var(--tinta-suave);display:flex">${ICO[t.nombre]||''}</span>
          <label>${t.nombre}</label><strong class="num">${nf(porTurno[t.id]||0)} ${u}</strong></div>`).join('')}
      </div>`;

  /* --- día por día --- */
  const filas=jornadas.slice().reverse().map(j=>{
    const [aa,mm]=j.ym.split('-');
    const dow=DOW[new Date(`${j.ym}-${j.d}T12:00:00`).getDay()];
    const prodDia={}; let tkDia=0;
    Object.values(j.turnos).forEach(t=>{ tkDia+=Number(t.tickets)||0;
      Object.entries(t[g]||{}).forEach(([k,v])=>prodDia[k]=(prodDia[k]||0)+(Number(v)||0)); });
    const cierre=porRubro?`${nf(tkDia)}<i>tk</i>`:`${nf(turnos.reduce((a,t)=>a+sumar((j.turnos[t.id]||{})[g]),0))}<i>${u}</i>`;

    // detalle: en tienda una tabla rubro x turno; en el resto, litros por turno
    const detalle = porRubro
      ? `<div class="scroll" style="margin:0"><table>
          <thead><tr><th>Rubro</th>${turnos.map(t=>`<th class="num">${t.nombre}</th>`).join('')}<th class="num">Día</th></tr></thead>
          <tbody>${lista.map(p=>{
            const vs=turnos.map(t=>(j.turnos[t.id]&&j.turnos[t.id][g]&&j.turnos[t.id][g][p.id])||0);
            return `<tr><td><span class="chip" style="background:${p.color};display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:7px"></span>${esc(p.nombre)}</td>
              ${vs.map((v,i)=>`<td class="num${j.turnos[turnos[i].id]?'':' falta'}">${j.turnos[turnos[i].id]?nf(v):'—'}</td>`).join('')}
              <td class="num"><strong>${nf(vs.reduce((a,b)=>a+b,0))}</strong></td></tr>`;}).join('')}
          </tbody>
          <tfoot><tr class="tot"><td>Tickets</td>
            ${turnos.map(t=>`<td class="num">${j.turnos[t.id]?nf(j.turnos[t.id].tickets||0):'—'}</td>`).join('')}
            <td class="num">${nf(tkDia)}</td></tr></tfoot>
        </table></div>`
      : `${turnos.map(t=>{
          const hay=!!j.turnos[t.id], v=hay?sumar(j.turnos[t.id][g]):0;
          return `<div class="turno-fila${hay?'':' sin'}">
            <span class="ic">${ICO[t.nombre]||''}</span>
            <span class="nom">${t.nombre}</span>
            <span class="val">${hay?nf(v)+`<i>${u}</i>`:'sin carga'}</span></div>`;
        }).join('')}
        ${Object.keys(prodDia).length?`<div class="desglose">${lista.filter(p=>prodDia[p.id]).map(p=>
          `<span class="pdt">${p.color?`<span style="background:${p.color}"></span>`:''}<b>${esc(p.nombre)}</b><em>${nf(prodDia[p.id])}</em></span>`).join('')}</div>`:''}`;

    const kd=sec+'|'+j.ym+'-'+j.d;
    return `<details class="dia" data-dia="${kd}"${S.diasAbiertos[kd]?' open':''}><summary>
        <span class="flecha">${ICO.flecha}</span>
        <span class="dow">${dow}</span>
        <span class="f">${j.d}/${mm}/${aa}</span>
        <span class="tt">${cierre}</span></summary>
      <div class="cuerpo-dia">${detalle}</div></details>`;
  }).join('');

  return `<div class="envoltorio">
    ${filtro}
    ${S.filtroCorrido?`<div class="aviso">${SECTORES[sec]} no tiene datos del mes que estabas mirando, así que te muestro <strong>${esc(rotulo)}</strong>, el último cargado.</div>`:''}
    ${cabecera}
    ${tarjetaCombos}
    ${tarjetaTurno}
    <div class="tarjeta">
      <h2>Día por día</h2>
      <p class="sub">${jornadas.length} día${jornadas.length>1?'s':''} con carga. Tocá uno para ver ${porRubro?'qué vendió cada turno de cada rubro':'los turnos'}.${faltan?` Hay ${faltan} turno${faltan>1?'s':''} sin carga.`:''}</p>
      <div class="acordeon">${filas}
        <div class="fila-mes"><span class="f">${esc(rotulo)}</span>
          <span class="tt">${porRubro?nf(tickets)+'<i>tk</i>':nf(total)+`<i>${u}</i>`}</span></div>
      </div>
    </div></div>`;
}

/* ---------- comparativo ---------- */
function escala(max){
  const paso=Math.pow(10,Math.floor(Math.log10(max/4||1)));
  let p=paso; [1,2,2.5,5,10].some(k=>{ if(paso*k>=max/4){p=paso*k;return true;} });
  const top=Math.ceil(max/p)*p, marcas=[];
  for(let v=0;v<=top+0.001;v+=p) marcas.push(v);
  return {max:top,marcas};
}
function digitos(v,d=0){
  return `<span class="digitos">${nf(v,d).split('').map(c=>/\d/.test(c)?`<span class="dig">${c}</span>`:`<span class="sep">${c}</span>`).join('')}</span>`;
}

async function vistaComparativo(sec){
  const r=await roll(sec), u=UNIDAD[sec], lista=listaDe(sec);
  const anios=[...new Set(Object.keys(r).map(k=>k.slice(0,4)))].sort();
  if(!anios.length) return `<div class="envoltorio"><div class="tarjeta">
    <h2>Comparativo</h2><p class="vacio">Todavía no hay datos para comparar.<br>Cargá al menos un mes desde Administración.</p></div></div>`;

  const porRubro=sec==='tienda';
  const y2=anios[anios.length-1];
  const y1=(S.cmpAnio&&anios.includes(S.cmpAnio)&&S.cmpAnio!==y2)?S.cmpAnio:(anios[anios.length-2]||y2);
  const serie=a=>MESES.map((_,m)=>r[`${a}-${String(m+1).padStart(2,'0')}`]||null);
  const valGlobal=x=>x?(porRubro?(x.tickets||0):(x.total||0)):0;
  const s1=serie(y1), s2=serie(y2);
  const tot=s=>s.reduce((a,x)=>a+valGlobal(x),0);
  const mesesCon=[...new Set(Object.keys(r).map(k=>k.slice(5,7)))].sort();
  const cm=(S.cmpMes&&S.cmpMes!=='todos'&&mesesCon.indexOf(S.cmpMes)>=0)?S.cmpMes:'todos';
  const iM=cm==='todos'?-1:Number(cm)-1;
  const rot=cm==='todos'?'Año':MESES_L[iM];
  const t1=cm==='todos'?tot(s1):valGlobal(s1[iM]);
  const t2=cm==='todos'?tot(s2):valGlobal(s2[iM]);
  const comp=(cm==='todos'?MESES.map((_,m)=>m):[iM]).filter(m=>m>=0&&s1[m]&&s2[m]);
  const c1=comp.reduce((a,m)=>a+valGlobal(s1[m]),0), c2=comp.reduce((a,m)=>a+valGlobal(s2[m]),0);
  const varComp=c1?((c2-c1)/c1*100):null;
  const selMes=`<div class="filtro"><span class="et">Comparar</span>
    <select id="cmpMes"><option value="todos"${cm==='todos'?' selected':''}>Todo el año</option>
      ${mesesCon.map(v=>`<option value="${v}"${cm===v?' selected':''}>${MESES_L[Number(v)-1]}</option>`).join('')}</select></div>`;

  /* --- proyección del último mes cargado, si está incompleto --- */
  let proy='';
  const ymUlt=cm==='todos'?Object.keys(r).filter(k=>k.slice(0,4)===y2).sort().pop():(r[`${y2}-${cm}`]?`${y2}-${cm}`:null);
  if(ymUlt){
    const data=await ops(sec,ymUlt);
    const cargados=Object.keys(data).length, delMes=diasDelMes(ymUlt);
    if(cargados&&cargados<delMes){
      const hasta=valGlobal(r[ymUlt]), prom=hasta/cargados, fin=prom*delMes;
      const pp=r[ymUlt].porProd||{};
      proy=`<div class="tarjeta">
        <div class="eyebrow">Proyección · ${nombreMes(ymUlt)}</div>
        <p class="sub">Con ${cargados} día${cargados>1?'s':''} cargado${cargados>1?'s':''} de ${delMes}, a este ritmo el mes cierra en:</p>
        <div class="tres">
          <div><div class="rot">${sec==='playa'?'Litros':'Unidades'} hasta ahora</div>${digitos(hasta)}</div>
          <div><div class="rot">Promedio diario</div>${digitos(prom)}</div>
          <div><div class="rot">Proyección fin de mes</div>${digitos(fin)}</div>
        </div>
        <div class="eyebrow" style="margin-top:15px">Proyección por producto</div>
        ${lista.filter(p=>pp[p.id]).map(p=>`<div class="campo">
          <span class="chip" style="background:${p.color||'#4A5D80'}"></span>
          <label>${esc(p.nombre)}<small style="display:block;font-size:11.5px;color:var(--tinta-suave);font-family:'IBM Plex Mono',monospace">${nf(pp[p.id])} ${u} hasta ahora</small></label>
          <strong class="num">${nf(pp[p.id]/cargados*delMes)} ${u}</strong></div>`).join('')}
        <p class="sub" style="margin-top:11px">Es una estimación lineal: supone que lo que queda del mes se vende al mismo promedio que lo cargado.</p>
      </div>`;
    }
  }

  /* --- gráfico mes a mes --- */
  const max=Math.max(...MESES.map((_,m)=>Math.max(valGlobal(s1[m]),valGlobal(s2[m]))),1);
  S.grafDatos=MESES.map((mm,m)=>({rot:MESES_L[m],y1,y2,a:s1[m]?valGlobal(s1[m]):null,b:s2[m]?valGlobal(s2[m]):null,uni:porRubro?'tk':u}));
  const cols=MESES.map((mm,m)=>{
    const a=valGlobal(s1[m]), b=valGlobal(s2[m]);
    return `<div class="col${m===iM?' sel':''}" data-i="${m}" tabindex="0">
      <div class="barras">
        <div class="b b1" style="height:${a/max*100}%"></div>
        <div class="b b2" style="height:${b/max*100}%"></div>
      </div><div class="et">${mm}</div></div>`;
  }).join('');

  // asegura el reparto por turno de los meses que se van a comparar
  for(const m of comp){
    await conTurnos(sec,`${y1}-${String(m+1).padStart(2,'0')}`,r);
    await conTurnos(sec,`${y2}-${String(m+1).padStart(2,'0')}`,r);
  }
  const s1b=serie(y1), s2b=serie(y2);
  const accP=(s,pid)=>comp.reduce((x,m)=>x+((s[m].porProd||{})[pid]||0),0);
  const accT=(s,tid)=>comp.reduce((x,m)=>x+((s[m].porTurno||{})[tid]||0),0);
  const totC1=comp.reduce((x,m)=>x+valGlobal(s1b[m]),0), totC2=comp.reduce((x,m)=>x+valGlobal(s2b[m]),0);
  const pc=(v,t)=>t?Math.round(v/t*100):0;
  const dif=(a,b)=>a?((b-a)/a*100):null;
  const flecha=v=>v===null?'—':`${v<0?'▼':'▲'} ${v>0?'+':''}${nf(v,1)}%`;

  /* --- venta por producto: barras horizontales --- */
  const prods=lista.filter(p=>accP(s1b,p.id)||accP(s2b,p.id));
  const maxP=Math.max(...prods.map(p=>Math.max(accP(s1b,p.id),accP(s2b,p.id))),1);
  const ejeP=escala(maxP);
  const graficoProd=prods.length?`<div class="hgraf">
    ${prods.map(p=>{
      const a=accP(s1b,p.id), b=accP(s2b,p.id);
      return `<div class="hfila"><div class="hnom">${esc(p.nombre)}</div>
        <div class="hbarras">
          <div class="hb"><i style="width:${a/ejeP.max*100}%;background:#5B6B8F"></i><em>${porRubro?nf(a):pc(a,totC1)+'%'}</em></div>
          <div class="hb"><i style="width:${b/ejeP.max*100}%;background:var(--cian)"></i><em>${porRubro?nf(b):pc(b,totC2)+'%'}</em></div>
        </div></div>`;
    }).join('')}
    <div class="hfila"><div class="hnom"></div><div class="heje">
      ${ejeP.marcas.map(v=>`<span>${nf(v)}</span>`).join('')}</div></div>
  </div>`:`<p class="vacio">Sin datos por producto.</p>`;

  /* --- venta por turno: barras verticales --- */
  const ORDEN={'Mañana':0,'Tarde':1,'Noche':2};
  const turnos=S.cfg.turnos[sec].slice().sort((x,y)=>(ORDEN[x.nombre]??9)-(ORDEN[y.nombre]??9));
  const maxT=Math.max(...turnos.map(t=>Math.max(accT(s1b,t.id),accT(s2b,t.id))),1);
  const ejeT=escala(maxT);
  S.turDatos=turnos.map(t=>({rot:t.nombre,y1,y2,a:accT(s1b,t.id),b:accT(s2b,t.id)}));
  const graficoTur=comp.length?`
    <div class="varturnos">${turnos.map(t=>{
      const v=dif(accT(s1b,t.id),accT(s2b,t.id));
      return `<span><b>${t.nombre}:</b> <span class="var ${v===null?'nula':v>0?'pos':'neg'}">${flecha(v)}</span></span>`;
    }).join('')}</div>
    <div class="vgraf-wrap"><div class="vgraf">
      <div class="veje">${ejeT.marcas.slice().reverse().map(v=>`<span>${nf(v)}</span>`).join('')}</div>
      <div class="vcols">${turnos.map((t,i)=>{
        const a=accT(s1b,t.id), b=accT(s2b,t.id);
        return `<div class="vcol" data-i="${i}" tabindex="0"><div class="vbarras">
            <div class="vb"><em>${porRubro?nf(a):pc(a,totC1)+'%'}</em><i style="height:${a/ejeT.max*100}%;background:#5B6B8F"></i></div>
            <div class="vb"><em>${porRubro?nf(b):pc(b,totC2)+'%'}</em><i style="height:${b/ejeT.max*100}%;background:var(--cian)"></i></div>
          </div><div class="vet">${t.nombre}</div></div>`;
      }).join('')}</div>
    </div><div class="tip" id="tipTur"></div></div>`:`<p class="vacio">Hace falta el mismo mes en los dos años.</p>`;

  /* --- mix dentro de cada familia --- */
  const familias=porRubro?[]:[...new Set(lista.map(p=>p.familia).filter(Boolean))];
  const mixHTML=familias.map(fam=>{
    const ps=lista.filter(p=>p.familia===fam&&(accP(s1b,p.id)||accP(s2b,p.id)));
    if(ps.length<1) return '';
    const F1=ps.reduce((a,p)=>a+accP(s1b,p.id),0), F2=ps.reduce((a,p)=>a+accP(s2b,p.id),0);
    const vf=dif(F1,F2);
    const pila=(s,tot)=>`<div class="pila"><span class="yr">${s===s1b?y1.slice(2):y2.slice(2)}</span>
      <div class="p">${ps.map(p=>{const x=accP(s,p.id), q=tot?x/tot*100:0;
        return q>0?`<i style="width:${q}%;background:${p.color}" title="${esc(p.nombre)}">${q>=17?Math.round(q)+'%':''}</i>`:'';}).join('')}</div>
      <span class="tt">${nf(tot)}</span></div>`;
    return `<div class="mixfam">
      <div class="mixcab"><span>${esc(fam)}</span>
        <span class="var ${vf===null?'nula':vf>0?'pos':'neg'}">${flecha(vf)}</span></div>
      ${F1?pila(s1b,F1):''}${F2?pila(s2b,F2):''}
      <table class="mix"><tbody>
        ${ps.map(p=>{const a=accP(s1b,p.id), b=accP(s2b,p.id);
          return `<tr><td><span class="chip" style="background:${p.color}"></span>${esc(p.nombre)}</td>
            <td class="num pcs">${pc(a,F1)}%</td><td class="num">${nf(a)}</td>
            <td class="num pcs">${pc(b,F2)}%</td><td class="num">${nf(b)}</td></tr>`;}).join('')}
      </tbody></table></div>`;
  }).join('');

  const insignia=varComp===null?'':`<span class="insignia ${varComp<0?'baja':'sube'}">${varComp<0?'▼':'▲'} ${nf(Math.abs(varComp),1)}% ${varComp<0?'menos':'más'} que ${y1}</span>`;

  return `<div class="envoltorio">
    ${anios.length>2?`<div class="subnav">${anios.filter(a=>a!==y2).map(a=>
      `<button data-anio="${a}" aria-current="${y1===a}">${a} vs ${y2}</button>`).join('')}</div>`:''}
    ${selMes}
    <div class="anios">
      <div class="anio"><div class="rot">${rot} ${y1}</div>${digitos(t1)}
        <div class="pie">${sec==='playa'?'Litros vendidos':porRubro?'Tickets emitidos':'Unidades vendidas'}</div></div>
      <div class="anio"><div class="rot">${rot} ${y2} ${insignia}</div>${digitos(t2)}
        <div class="pie">${sec==='playa'?'Litros vendidos':porRubro?'Tickets emitidos':'Unidades vendidas'}</div></div>
    </div>
    ${cm==='todos'&&comp.length&&comp.length<12?`<div class="aviso">La comparación toma los meses con datos en los dos años: <strong>${comp.map(m=>MESES[m]).join(', ')}</strong>. Los totales de arriba son de todo lo cargado en cada año, así que si a un año le faltan meses, no son comparables entre sí.</div>`:''}
    ${cm!=='todos'&&comp.length===0?`<div class="aviso">${MESES_L[iM]} tiene datos en un solo año, así que no hay comparación posible todavía.</div>`:''}
    ${proy}
    <div class="tarjeta">
      <h2>${porRubro?'Tickets por mes':'Venta total por mes'}</h2>
      <p class="sub">${y1} contra ${y2}, en ${sec==='playa'?'litros':porRubro?'tickets':'unidades'}. Pasá el mouse o tocá un mes.</p>
      <div class="graf"><div class="graf-in">${cols}</div><div class="tip" id="tipGraf"></div></div>
      <div class="leyenda"><span><i style="background:#5B6B8F"></i>${y1}</span><span><i style="background:var(--cian)"></i>${y2}</span></div>
    </div>
    <div class="dos">
      <div class="tarjeta">
        <h2>${porRubro?'Venta por rubro':'Venta por producto'}</h2>
        <p class="sub">${cm==='todos'?'Acumulado de los meses comparables':MESES_L[iM]+' de cada año'}, en ${sec==='playa'?'litros':'unidades'}. ${porRubro?'':' El porcentaje es lo que pesa cada producto en el total del año.'}</p>
        ${graficoProd}
        <div class="leyenda"><span><i style="background:#5B6B8F"></i>${y1}</span><span><i style="background:var(--cian)"></i>${y2}</span></div>
      </div>
      <div class="tarjeta">
        <h2>Venta por turno</h2>
        <p class="sub">Cuánto despachó cada turno y cómo varió de un año al otro.</p>
        ${graficoTur}
        <div class="leyenda"><span><i style="background:#5B6B8F"></i>${y1}</span><span><i style="background:var(--cian)"></i>${y2}</span></div>
      </div>
    </div>
    ${mixHTML?`<div class="tarjeta">
      <h2>Mix de productos</h2>
      <p class="sub">Cómo se reparte cada familia por dentro. El porcentaje es sobre el total de la familia, no sobre el total general.</p>
      ${mixHTML}
    </div>`:''}
    </div>`;
}

async function vistaSector(sec){
  const subs=[['mes','Por mes'],['comparativo','Comparativo']];
  if(sec==='playa'||sec==='tienda') subs.push(['objetivos','Objetivos']);
  if(sec==='boxes'){ subs.length=0; subs.push(['servicios','Servicios'],['comparativo','Comparativo'],
    ['objetivos','Objetivos'],['presupuesto','Presupuesto'],['control','Control']); }
  if(!subs.some(s=>s[0]===S.sub)) S.sub=subs[0][0];
  const cuerpo=S.sub==='servicios'?await vistaBoxes()
    :S.sub==='comparativo'?(sec==='boxes'?await vistaCmpBoxes():await vistaComparativo(sec))
    :S.sub==='objetivos'?(sec==='tienda'?await vistaObjTienda():sec==='boxes'?await vistaObjBoxes():await vistaObjetivos(sec))
    :S.sub==='presupuesto'?await vistaPresupuesto()
    :S.sub==='control'?(S.ctrlAbierto?await vistaControl():candadoControl())
    :await vistaMes(sec);
  return `<div class="envoltorio" style="padding-bottom:0">
      <div class="subnav">${subs.map(([k,t])=>`<button data-sub="${k}" aria-current="${S.sub===k}">${t}</button>`).join('')}</div>
    </div>${cuerpo}`;
}

/* ---------- listas de precios y presupuesto ---------- */
const norm=s=>String(s===null||s===undefined?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toUpperCase();
const money=v=>'$ '+nf(v,2);

async function listas(){
  if(!S.listas) S.listas={aceites:await leer('precios:aceites',[]),filtros:await leer('precios:filtros',[])};
  return S.listas;
}
// aceites: encabezado con CÓDIGO; código col1, descripción col3, precio col7
function parseAceites(filas){
  const i=filas.findIndex(r=>norm(r[0])==='CODIGO');
  if(i<0) throw new Error('no encontré la fila de encabezado con CÓDIGO');
  const out=[];
  for(const r of filas.slice(i+1)){
    const c=String(r[0]??'').trim(), d=String(r[2]??'').trim(), p=Number(r[6])||0;
    if(!c||!d||norm(c)==='NAN') continue;
    out.push({c,d,p,l:String(r[1]??'').trim(),e:String(r[3]??'').trim()});
  }
  return out;
}
// filtros: encabezado con Articulo; código col1, descripción col2, precio col3
function parseFiltros(filas){
  const i=filas.findIndex(r=>norm(r[0])==='ARTICULO');
  if(i<0) throw new Error('no encontré la fila de encabezado con Articulo');
  const out=[];
  for(const r of filas.slice(i+1)){
    const c=String(r[0]??'').trim(), d=String(r[1]??'').trim(), p=Number(r[2])||0;
    if(!c||!d||norm(c)==='NAN') continue;
    out.push({c,d,p});
  }
  return out;
}
async function filasDeExcel(f){
  if(typeof XLSX==='undefined') throw new Error('no se pudo cargar el lector de Excel');
  const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
  return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,blankrows:false});
}

function buscarPrecios(L,q){
  const t=norm(q); if(t.length<2) return [];
  const res=[];
  const barre=(arr,tipo)=>{
    for(const it of arr){
      const c=norm(it.c), d=norm(it.d);
      if(c===t) res.unshift({...it,tipo,exacto:true});
      else if(c.indexOf(t)>=0||d.indexOf(t)>=0) res.push({...it,tipo});
      if(res.length>60) break;
    }
  };
  barre(L.aceites,'Aceite'); barre(L.filtros,'Filtro');
  return res.slice(0,25);
}

// 11 1234-5678 -> 5491112345678
function telWA(t){
  let d=String(t||'').replace(/\D/g,'');
  if(!d) return '';
  if(d.indexOf('54')===0) d=d.slice(2);
  if(d.indexOf('0')===0) d=d.slice(1);
  if(d.indexOf('9')===0&&d.length>10) d=d.slice(1);
  d=d.replace(/^(\d{2,4})15/,'$1');
  return '549'+d;
}
function textoWA(p){

  return `${saludo()}, te comparto el presupuesto para tu vehículo${v?' '+v:''}.\n\nMuchos saludos,\nYPF FARMEX SAIC — Av. Maipú 999, Vicente López`;
}

async function cargarJsPDF(){
  if(window.jspdf&&window.jspdf.jsPDF) return window.jspdf.jsPDF;
  await new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s.onload=res; s.onerror=()=>rej(new Error('no se pudo cargar el generador de PDF'));
    document.head.appendChild(s);
  });
  if(!window.jspdf) throw new Error('el generador de PDF no quedó disponible');
  return window.jspdf.jsPDF;
}

async function armarPDF(p){
  const jsPDF=await cargarJsPDF();
  const doc=new jsPDF({unit:'mm',format:'a4'});
  const AZUL=[0,71,187], GRIS=[110,110,110];
  let y=22;
  doc.setFont('helvetica','normal'); doc.setFontSize(20); doc.setTextColor(20);
  doc.text('Presupuesto',18,y);
  doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(...AZUL);
  doc.text('YPF FARMEX SAIC',192,y,{align:'right'});
  y+=12;
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(40);
  const cab=[
    'Boxes: YPF FARMEX SAIC',
    'Dirección: Av. Maipú 999, Vicente López',
    'Servicio: Servicio Premium',
    'Vehículo: '+(vehiculoTxt(p)||'—'),
    'Fecha: '+new Date().toLocaleDateString('es-AR')
  ];
  cab.forEach(l=>{ doc.text(l,18,y); y+=5; });
  y+=3;
  doc.setDrawColor(200); doc.line(18,y,192,y); y+=8;

  const X=[18,52,150,192];
  doc.setFillColor(...AZUL); doc.rect(18,y-5.5,174,8,'F');
  doc.setTextColor(255); doc.setFont('helvetica','bold'); doc.setFontSize(9);
  doc.text('Tipo',X[0]+2,y); doc.text('Descripción',X[1],y);
  doc.text('Cantidad',X[2],y,{align:'right'}); doc.text('Precio',X[3]-2,y,{align:'right'});
  y+=8;
  doc.setFont('helvetica','normal'); doc.setTextColor(40);
  p.items.forEach((it,n)=>{
    if(y>265){ doc.addPage(); y=22; }
    if(n%2===0){ doc.setFillColor(245,245,245); doc.rect(18,y-5,174,7.5,'F'); }
    doc.text(it.tipo,X[0]+2,y);
    doc.text(doc.splitTextToSize(it.d,94)[0],X[1],y);
    doc.text(String(it.cant),X[2],y,{align:'right'});
    doc.text(money(it.p*it.cant),X[3]-2,y,{align:'right'});
    y+=7.5;
  });
  y+=6;
  const tot=totalPres(p);
  doc.setFont('helvetica','bold'); doc.setFontSize(11);
  doc.text('Total: '+money(tot),18,y);
  y+=11;

  // financiación: siempre visible, calculada sobre el total
  if(y>250){ doc.addPage(); y=22; }
  doc.setDrawColor(220); doc.line(18,y-4,192,y-4);
  doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(...AZUL);
  doc.text('MEDIOS DE PAGO',18,y+2);
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(40);
  doc.text('Visa y Mastercard',18,y+8);
  CUOTAS.forEach((n,i)=>{
    doc.text(`${n} cuotas sin interés de ${money(tot/n)}`,18,y+14+i*5.5);
  });
  y+=14+CUOTAS.length*5.5+6;
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...GRIS);
  doc.text('Presupuesto informativo, sujeto a cambios y/o disponibilidad de la sucursal.',18,y);
  return doc;
}

// lee el .htm del cierre: fecha, turno, cantidades por rubro y tickets
function leerCierre(texto,nombreArch){
  const doc=new DOMParser().parseFromString(texto,'text/html');
  const plano=(doc.body?doc.body.textContent:texto).replace(/\u00a0/g,' ');
  const lineas=plano.split('\n').map(l=>l.replace(/[ \t]+/g,' ').trim()).filter(Boolean);

  const fm=plano.match(/(\d{2})\/(\d{2})\/(\d{4})/);
  if(!fm) return {error:`En “${nombreArch}” no encontré la fecha.`};
  const fecha=`${fm[3]}-${fm[2]}-${fm[1]}`;

  // el turno viene en el nombre: TM mañana, TT tarde. Sin la extensión, que también trae "TM".
  const n=norm(String(nombreArch).replace(/\.[^.]+$/,''));
  let turno=/TT/.test(n)?'T2':/TM/.test(n)?'T1':null;
  if(!turno){
    const hm=plano.match(/\d{2}\/\d{2}\/\d{4}\s+(\d{2}):\d{2}/);
    turno=hm?(Number(hm[1])<15?'T1':'T2'):null;
  }
  if(!turno) return {error:`En “${nombreArch}” no pude determinar el turno. Poné TM o TT en el nombre del archivo.`};

  const rubro={}, importe={};
  const RE=/^(\d{2}-\d{3})\s+(.+?)\s+(-?[\d.]+,\d+)\s+(-?[\d.]+,\d{2})$/;
  const nombres={};
  lineas.forEach(l=>{
    const m=l.match(RE); if(!m) return;
    const cod=m[1], cant=numeroSig(m[3]), imp=numeroSig(m[4]);
    if(cant) rubro[cod]=(rubro[cod]||0)+cant;
    if(imp) importe[cod]=(importe[cod]||0)+imp;
    nombres[cod]=m[2].trim();
  });
  if(!Object.keys(rubro).length&&!Object.keys(importe).length)
    return {error:`En “${nombreArch}” no encontré el resumen por rubros.`};

  const tk=plano.match(/FACTURAS?\s*\([A-Z]\)\s*:?\s*PRIM:?\s*(\d+)\s*ULT:?\s*(\d+)/i);
  const tickets=tk?Math.max(0,Number(tk[2])-Number(tk[1])+1):0;
  const tr=plano.match(/TOTAL A RENDIR[.\s:]*(-?[\d.]+,\d{2})/i);
  const cierre=plano.match(/CIERRE DE CAJA NRO:\s*(\d+)/i);

  return {fecha,turno,rubro,importe,tickets,nombres,
          rendir:tr?numeroSig(tr[1]):0, cierre:cierre?cierre[1]:'', arch:nombreArch};
}
// acepta negativos, a diferencia de numero()
function numeroSig(s){
  let t=String(s??'').trim().replace(/\s/g,'');
  const neg=/^-/.test(t); t=t.replace(/^-/,'');
  if(t.indexOf(',')>=0&&t.indexOf('.')>=0) t=t.replace(/\./g,'').replace(',','.');
  else if(t.indexOf(',')>=0) t=t.replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(t)) t=t.replace(/\./g,'');
  const v=parseFloat(t);
  return isFinite(v)?(neg?-v:v):0;
}

const OPERARIOS=[{id:'juan',nombre:'Juan Cruz',escala:true},{id:'maxi',nombre:'Maxi',escala:false}];
const TIPOS_SERV=[{id:'Express',nombre:'Express'},{id:'Completo',nombre:'Completo'},{id:'Premium',nombre:'Premium'}];
const COM_BASE=1.5, COM_ALTA=2, UMBRAL_PREMIUM=50;

async function control(){
  if(!S.ctrl) S.ctrl=await leer('boxes:control',{});
  return S.ctrl;
}
const claveCtrl=(f,i,orden)=>orden?('o:'+orden):(f+'#'+i);

// cuenta comisiones de un mes: Juan Cruz salta a 2% si supera el 50% de Premium
function liquidar(regs){
  const out={};
  OPERARIOS.forEach(op=>out[op.id]={n:0,porTipo:{},venta:0,premium:0});
  Object.values(regs).forEach(r=>{
    const o=out[r.op]; if(!o) return;
    o.n++; o.venta+=Number(r.importe)||0;
    o.porTipo[r.tipo]=(o.porTipo[r.tipo]||0)+1;
    if(r.tipo==='Premium') o.premium++;
  });
  OPERARIOS.forEach(op=>{
    const o=out[op.id];
    o.pct=o.n?o.premium/o.n*100:0;
    o.tasa=(op.escala&&o.pct>=UMBRAL_PREMIUM)?COM_ALTA:COM_BASE;
    o.comision=o.venta*o.tasa/100;
    // cuántos Premium más necesita para llegar al 2%
    if(op.escala&&o.tasa===COM_BASE&&o.n){
      let faltan=0, p=o.premium, n=o.n;
      while(p/n*100<UMBRAL_PREMIUM&&faltan<9999){ p++; n++; faltan++; }
      o.faltan=faltan;
    }
  });
  return out;
}

function objBVigente(o,anio,meses,k){
  let mes=null;
  meses.forEach(m=>{ if(objBV(o,`${anio}-${m}`,k,'min')||objBV(o,`${anio}-${m}`,k,'max')) mes=m; });

          cubre:meses.slice(0,meses.indexOf(mes)+1)};
}

          return `<tr><td>${MESES_L[m]}</td><td class="num">${s1[m]===null?'—':nf(s1[m])}</td>
            <td class="num">${s2[m]===null?'—':nf(s2[m])}</td>
            <td class="num"><span class="var ${v===null?'nula':v>0?'pos':'neg'}">${v===null?'—':(v>0?'+':'')+nf(v,1)+'%'}</span></td></tr>`;
        }).join('')}</tbody>
        <tfoot><tr class="tot"><td>Comparables</td><td class="num">${nf(c1)}</td><td class="num">${nf(c2)}</td>
          <td class="num">${varP===null?'—':(varP>0?'+':'')+nf(varP,1)+'%'}</td></tr></tfoot>
      </table></div>
    </div></div>`;
}

const SERVICIOS=[
  {id:'Premium', nombre:'Premium', color:'#22E3F5'},
  {id:'Completo',nombre:'Completo',color:'#9D7CFF'},
  {id:'Express', nombre:'Express', color:'#3DE0A0'}

const CANALES=[{id:'APP YPF',nombre:'App YPF',color:'#22E3F5'},{id:'Presencial',nombre:'Presencial',color:'#9D7CFF'}];

// del reporte solo se guarda lo que sirve: nada de nombre, DNI, teléfono, mail ni patente
function leerReporteBoxes(filas,nombreArch){
  // el reporte trae arriba una línea de filtros que también dice "Fecha de finalización":
  // el encabezado de verdad es el que tiene además el tipo de trabajo y la marca.
  const esCab=r=>{
    const t=(r||[]).map(c=>norm(c==null?'':c)).join('|');
    return t.indexOf('FECHA DE FINALIZACION')>=0&&t.indexOf('TIPO DE TRABAJO')>=0;
  };
  const iCab=filas.findIndex(esCab);
  if(iCab<0) return {error:`En “${nombreArch}” no encontré la fila de encabezado del listado (con “Fecha de finalización” y “Tipo de trabajo”).`};
  const cab=(filas[iCab]||[]).map(c=>norm(c==null?'':c));
  const buscar=(...pistas)=>{
    for(const p of pistas){ const q=norm(p); const i=cab.findIndex(c=>String(c||'').indexOf(q)>=0); if(i>=0) return i; }
    return -1;
  };
  const iF=buscar('FECHA DE FINALIZACI'), iT=buscar('TIPO DE TRABAJO'),
        iE=buscar('ESTADO'), iM=buscar('ACTIVO: MARCA'), iMo=buscar('ACTIVO: MODELO'),
        iC=buscar('CANAL ORIGEN'), iO=buscar('NUMERO DE ORDEN','NÚMERO DE ORDEN');
  if(iF<0||iT<0) return {error:`En “${nombreArch}” faltan las columnas de fecha o tipo de trabajo.`};

  const servicios=[]; let saltadas=0;
  for(const r0 of filas.slice(iCab+1)){
    const r=r0||[];
    const cf=String(r[iF]??'').trim();
    const m=cf.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})\D+(\d{1,2}):(\d{2})/);
    if(!m){ if(cf) saltadas++; continue; }
    const est=String(r[iE]??'').trim();
    if(est&&!/completad/i.test(est)){ saltadas++; continue; }
    const dia=m[1].padStart(2,'0'), mes=m[2].padStart(2,'0');
    servicios.push({
      f:`${m[3]}-${mes}-${dia}`, h:Number(m[4]),
      t:String(r[iT]??'').trim()||'Sin tipo',
      ma:String(r[iM]??'').trim().toUpperCase()||'—',
      mo:String(r[iMo]??'').trim()||'—',
      c:String(r[iC]??'').trim()||'—',
      o:iO>=0?String(r[iO]??'').trim():''
    });
  }
  if(!servicios.length) return {error:`En “${nombreArch}” no encontré servicios completados.`};
  // sin duplicados por número de orden
  const vistos=new Set(), limpio=[];
  for(const s of servicios){
    const k=s.o||`${s.f}|${s.h}|${s.t}|${s.ma}|${s.mo}`;
    if(vistos.has(k)) continue;
    vistos.add(k); limpio.push(s);
  }
  const meses={};
  limpio.forEach(s=>{
    const ym=s.f.slice(0,7), d=s.f.slice(8,10);
    meses[ym]=meses[ym]||{dias:{},n:0};
    (meses[ym].dias[d]=meses[ym].dias[d]||[]).push({h:s.h,t:s.t,ma:s.ma,mo:s.mo,c:s.c});
    meses[ym].n++;
  });
  return {meses,total:limpio.length,saltadas,arch:nombreArch};
}

// resume un mes de servicios para las vistas
function resumenBoxes(dias){
  const porTipo={}, porMarca={}, porModelo={}, porCanal={}, porHora={}, porDia={};
  let n=0;
  Object.entries(dias).forEach(([d,lista])=>{
    porDia[d]=lista.length; n+=lista.length;
    lista.forEach(s=>{
      porTipo[s.t]=(porTipo[s.t]||0)+1;
      porMarca[s.ma]=(porMarca[s.ma]||0)+1;
      porModelo[s.ma+' '+s.mo]=(porModelo[s.ma+' '+s.mo]||0)+1;
      porCanal[s.c]=(porCanal[s.c]||0)+1;
      porHora[s.h]=(porHora[s.h]||0)+1;
    });
  });
  return {n,porTipo,porMarca,porModelo,porCanal,porHora,porDia};
}

const RE_TOP=/^(\d{5,9})\s+(.+?)\s+([A-Z]{2,3})\s+(\d{1,5})\s+([\d.]+,\d{2})/;
function renglonesTopaes(lineas){
  const out=[]; const vistos=new Set();
  const corta=/^(CODIGO|SUBTOTAL|TOTAL|IVA|SON |C\.A\.E|IMPORTANTE|NO SE ACEPTAN|Se(ñ|n)or|Domicilio|CUIT|Ingresos|Inicio|Remito|Vencimiento|Moneda|Condicion|Administraci|Centro|Parque|email|IVA RESPONSABLE|FACTURA|Nro\.|Fecha|Cotizaci)/i;
  for(const l0 of lineas){
    const l=String(l0).replace(/\s+/g,' ').trim();
    if(!l||corta.test(l)) continue;
    const m=l.match(RE_TOP);
    if(!m) continue;
    const cod=m[1], cant=Math.round(numeroSig(m[4]));
    if(!cant) continue;
    const k=cod+'|'+cant;
    if(vistos.has(k)) continue;
    vistos.add(k);
    out.push({cod,desc:m[2].trim(),cant,pu:numeroSig(m[5])});
  }
  return out;
}

const barraYPF=cod=>String(cod).trim()+'0';
// la presentación es el último patrón N/N de la descripción: "4/4" son 4 por caja,
// "12/1" son 12. La viscosidad no lleva barra (540, 1040), así que no se confunde.
function presentacion(desc){
  const ms=[...String(desc).matchAll(/(\d+)\s*\/\s*(\d+)/g)];
  if(!ms.length) return null;
  const u=Number(ms[ms.length-1][1]), l=Number(ms[ms.length-1][2]);
  if(!u||u>999) return null;
  return {upc:u,litros:l};
}
// renglón de YPF: codigo, descripcion, cantidad, UM, riesgo, valor unitario, importe
const RE_YPF=/^(\d{5,7})\s+(.+?)\s+(\d{1,4}(?:[.,]\d{1,3})?)\s+([A-Z]{2,3})\s+(\d+)\s+([\d.]+,\d{2,3})\s+([\d.]+,\d{2})\s*$/;
// a veces el código y la descripción abren el renglón y los números caen abajo
const RE_YPF_CAB=/^(\d{5,7})\s+([A-Za-zÁÉÍÓÚÑ][^\d]{3,})\s*$/;
const RE_YPF_COLA=/^(\d{1,4}(?:[.,]\d{1,3})?)\s+([A-Z]{2,3})\s+(\d+)\s+([\d.]+,\d{2,3})\s+([\d.]+,\d{2})\s*$/;
function renglonesYPF(lineas){
  const out=[]; let pend=null;
  const corta=/^(CODIGO|OBSERVACIONES|NRO\.RIESGO|IBP|IMPORTE|TOTAL|SON:|Remito|IVA |FINANCIACION|ICL|IDC|Producido|Precios|PAGOS|Cotizaci|IMPRENTA|CUIT|FECHA|HORA|CONTROLM|CAE|Recib|Es responsab|DOCUMENTO|Firma|HOJA|SRES|DOMICILIO|ENTREGA|VICENTE|P\. PAGO|TRANSPORTISTA|CP\/|PRECINTOS|CONDUCTOR|PATENTE|CAPACIDAD|PESO|OC:|N° |CUENTA|INCOTERMS|FORMA|BV\.|CABA|YPF|Calidad|ORIGINAL|A$)/i;
  const cerrar=()=>{ if(pend&&pend.listo){ out.push(pend); } pend=null; };
  for(const l0 of lineas){
    const l=l0.replace(/\s+/g,' ').trim();
    if(!l) continue;
    let m=l.match(RE_YPF);
    if(m){
      cerrar();
      pend={cod:m[1],desc:m[2].trim(),cajas:numeroSig(m[3]),um:m[4],
            vu:numeroSig(m[6]),imp:numeroSig(m[7]),linea:l,listo:true};
      continue;
    }
    m=l.match(RE_YPF_CAB);
    if(m&&!corta.test(l)){ cerrar(); pend={cod:m[1],desc:m[2].trim(),listo:false}; continue; }
    if(pend&&!pend.listo){
      m=l.match(RE_YPF_COLA);
      if(m){ pend.cajas=numeroSig(m[1]); pend.um=m[2]; pend.vu=numeroSig(m[4]);
             pend.imp=numeroSig(m[5]); pend.linea=l; pend.listo=true; continue; }
    }
    // continuación de la descripción: se pega al renglón abierto
    if(pend&&!corta.test(l)&&/[A-Za-z0-9]{2,}/.test(l)&&!RE_YPF_COLA.test(l)&&l.length<70){
      pend.desc=(pend.desc+' '+l).replace(/\s+/g,' ').trim();
      continue;
    }
    if(corta.test(l)) { if(pend&&pend.listo){ out.push(pend); pend=null; } }
  }
  cerrar();
  // sin duplicados: la misma factura puede repetir encabezados por hoja
  const vistos=new Set();
  return out.filter(r=>{ const k=r.cod+'|'+r.imp; if(vistos.has(k)) return false; vistos.add(k); return true; });
}
async function armarYPF(renglones){
  const env=await envases();
  return renglones.map(r=>{
    const p=presentacion(r.desc);
    const upc=env[r.cod]||(p?p.upc:0);
    const origen=env[r.cod]?'guardado':(p?'descripción':'');
    const unidades=upc?r.cajas*upc:0;
    const pu=unidades?r.imp/unidades:0;
    return {...r,upc,origen,litros:p?p.litros:null,unidades,pu,barra:barraYPF(r.cod),
            cierra:unidades?Math.abs(unidades*pu-r.imp)<0.01:false};
  });
}

function leerReporteCombos(filas,nombreArch){
  const texto=(r,i)=>String((r||[])[i]??'').trim();
  const fFecha=filas.findIndex(r=>norm(texto(r,0)).indexOf('FECHA')===0);
  if(fFecha<0) return {error:`En “${nombreArch}” no encontré la fila de fechas.`};
  const fecha=s=>{ const m=String(s).match(/(\d{2})\/(\d{2})\/(\d{4})/); return m?`${m[3]}-${m[2]}-${m[1]}`:''; };
  const desde=fecha(texto(filas[fFecha],1)), hasta=fecha(texto(filas[fFecha],2));
  if(!desde||!hasta) return {error:`En “${nombreArch}” no pude leer el período.`};

  const fRubro=filas.findIndex(r=>norm(texto(r,0))==='RUBRO:');
  const rubro=fRubro>=0?texto(filas[fRubro],1).replace(/\D/g,''):'';

  // suma todas las filas cuyo Detalle (columna C) diga TOTAL COMBO
  let combos=0, filasCombo=0;
  for(const r of filas){
    if(norm(texto(r,2))!=='TOTAL COMBO') continue;
    const q=numeroSig(texto(r,3));
    if(q){ combos+=q; filasCombo++; }
  }
  const tipo=(TIPOS_COMBO.find(t=>t.rubros.includes(rubro))||{}).id||'';
  if(!tipo) return {error:`En “${nombreArch}” el rubro es ${rubro||'desconocido'} y no sé si es comida o cafetería.`};
  return {desde,hasta,rubro,tipo,combos:Math.round(combos),filasCombo,arch:nombreArch};
}

function combosPorDia(cortes){

  const dias={};
  Object.values(porPeriodo).forEach(lista=>{
    lista.sort((a,b)=>a.hasta.localeCompare(b.hasta));

    lista.forEach((c,i)=>{
      const d={comida:(c.comida||0)-prev.comida, cafe:(c.cafe||0)-prev.cafe};
      dias[c.hasta]={...d, acumulado:{comida:c.comida||0,cafe:c.cafe||0},
        primero:i===0, desde:c.desde,
        raro:(d.comida<0||d.cafe<0)};
      prev={comida:c.comida||0,cafe:c.cafe||0};
    });
  });
  return dias;
}

async function textoPDF(f){
  const lib=await cargarPdfJs();
  const doc=await lib.getDocument({data:await f.arrayBuffer()}).promise;
  const lineas=[];
  for(let n=1;n<=doc.numPages;n++){
    const pg=await doc.getPage(n), tc=await pg.getTextContent();
    const filas={};
    tc.items.forEach(it=>{
      const y=Math.round(it.transform[5]);
      (filas[y]=filas[y]||[]).push({x:it.transform[4],s:it.str});
    });
    Object.keys(filas).map(Number).sort((a,b)=>b-a).forEach(y=>{
      const t=filas[y].sort((a,b)=>a.x-b.x).map(o=>o.s).join(' ').replace(/\s+/g,' ').trim();
      if(t) lineas.push(t);
    });
  }
  return lineas;
}
// formato Renova: "1.00 PH3569 Descripción C14 21.00 8,943.89 22.40 6,940.46 6,940.46"
// la cantidad abre el renglón y el código va segundo; el resto son importes.
const RE_ITEM=/^(\d{1,4}(?:[.,]\d{1,3})?)\s+([A-Z0-9][A-Z0-9\-\/\.]{2,})\s+(.*)$/i;
const RE_CIERRE=/((?:[A-Z]{1,3}\d{0,3}\s+)?\d{1,3}[.,]\d{2}\s+)?[\d.,]+\s+[\d.,]+\s+[\d.,]+\s+[\d.,]+\s*$/;
function renglonesFactura(lineas){
  const out=[];
  const corta=/^(TOTAL|SUBTOTAL|IVA|NETO|CUIT|CAE|HOJA|SON PESOS|OBSERVACIONES|ORIGINAL|No se aceptan|Cantidad\s+Codigo)/i;
  for(const l0 of lineas){
    const l=l0.replace(/\s+/g,' ').trim();
    if(!l||corta.test(l)) continue;
    const m=l.match(RE_ITEM);
    if(!m){
      // renglón de continuación: se pega a la descripción del anterior
      const sinEsp=l.replace(/\s/g,'');
      const esHash=sinEsp.length>=20&&/^[0-9A-F]+$/i.test(sinEsp.slice(0,20));
      const tieneLetras=/[A-Za-zÁÉÍÓÚÑáéíóúñ]{2,}/.test(l);
      if(out.length&&tieneLetras&&!esHash&&!/^[\d.,\s]+$/.test(l)&&l.length>2&&!/\d[.,]\d{2}\s+[\d.,]+\s*$/.test(l))
        out[out.length-1].desc=(out[out.length-1].desc+' '+l).replace(/\s+/g,' ').trim();
      continue;
    }
    const cant=Math.max(1,Math.round(numero(m[1])));
    const cod=m[2].toUpperCase();
    // saca de la descripción la cola de importes y la unidad de medida
    let desc=m[3].replace(RE_CIERRE,'').trim();
    if(!desc) desc=cod;
    out.push({cod,desc,cant,linea:l});
  }
  return out;
}

/* ---------- objetivos ---------- */
const TRIM=[['01','02','03'],['04','05','06'],['07','08','09'],['10','11','12']];
const trimDe=mm=>Math.floor((Number(mm)-1)/3)+1;
const ROMANO=['1er','2do','3er','4to'];
// abre en el trimestre del último mes con datos, no en el de hoy
function trimPorDefecto(claves,anio){
  const delAnio=claves.filter(k=>k.slice(0,4)===anio).sort();
  if(delAnio.length) return trimDe(delAnio[delAnio.length-1].slice(5,7));
  return trimDe(hoyISO().slice(5,7));
}
const ID_INFINIA='inf';
const idsFam=fam=>S.cfg.combustibles.filter(p=>p.familia===fam).map(p=>p.id);

function objNorm(o,ym){
  const x=o[ym]||{}, g=k=>({min:(x[k]&&x[k].min!=null)?x[k].min:'',max:(x[k]&&x[k].max!=null)?x[k].max:''});
  return {naftas:g('naftas'),diesel:g('diesel'),mix:g('mix')};
}
const objV=(o,ym,met,k)=>Number(objNorm(o,ym)[met][k])||0;

// litros vendidos de una familia en un mes
function vendFam(r,ym,ids){
  const x=r[ym]; if(!x||!x.porProd) return 0;
  return ids.reduce((a,id)=>a+(x.porProd[id]||0),0);
}
// el objetivo que llega ya viene acumulado del trimestre: vale el del último mes cargado
function objVigente(o,anio,meses,met){
  let mes=null;
  meses.forEach(m=>{ if(objV(o,`${anio}-${m}`,met,'min')||objV(o,`${anio}-${m}`,met,'max')) mes=m; });
  if(!mes) return {mes:null,min:0,max:0,cubre:[]};
  return {mes,min:objV(o,`${anio}-${mes}`,met,'min'),max:objV(o,`${anio}-${mes}`,met,'max'),
          cubre:meses.slice(0,meses.indexOf(mes)+1)};
}
// 0% si no llega al mínimo, 100% si pasa el máximo, proporcional en el medio
function cumpl(real,min,max){
  if(!min&&!max) return null;
  if(!max||max<=min) return real>=min?100:0;
  if(real<min) return 0;
  if(real>=max) return 100;
  return (real-min)/(max-min)*100;
}
function barraMeta(real,min,max,uni){
  const pct=uni==='%', fmt=v=>pct?nf(v,1)+'%':nf(v);
  if(!min&&!max) return `<div class="meta"><div class="mrot"><span>Objetivo</span><span class="mpc">sin cargar</span></div></div>`;
  const c=cumpl(real,min,max);
  const tope=Math.max(max||min,real)*1.06||1;
  const col=c>=100?'var(--ok)':c<=0?'var(--alerta)':'var(--ambar)';
  const marca=(v,rot)=>v?`<b style="left:${Math.min(99.6,v/tope*100)}%" data-rot="${rot}"></b>`:'';
  const falta=real<min?min-real:(max&&real<max?max-real:0);
  const meta=real<min?'mínimo':'máximo';
  return `<div class="meta">
    <div class="mrot"><span>Objetivo mínimo ${fmt(min)} · máximo ${fmt(max)}</span>
      <span class="mpc ${c>=100?'ok':c<=0?'mal':''}">${nf(c,0)}%</span></div>
    <div class="mtrack">
      <i style="width:${Math.min(100,real/tope*100)}%;background:${col}"></i>
      ${marca(min,'mín')}${marca(max,'máx')}
    </div>
    <div class="mpie">Real ${fmt(real)}${falta?` · faltan ${fmt(falta)}${pct?' punto'+(falta>=2?'s':''):''} para el ${meta}`:' · máximo superado'}</div>
  </div>`;
}

// leerObj y vigente se pasan por parámetro: así combustible, tienda y boxes usan la misma tabla
function bloqueMeta(o,anio,meses,met,real,uni,leerObj,vigente){
  const pct=uni==='%';
  const fmt=v=>v?(pct?nf(v,1)+'%':nf(v)):'—';
  const oV=leerObj||objV;
  const vig=(vigente||objVigente)(o,anio,meses,met);
  const hasta=vig.mes?vig.cubre:meses;
  const RT=real.acum(hasta);
  const filas=meses.map((m,i)=>{
    const mi=oV(o,`${anio}-${m}`,met,'min'), ma=oV(o,`${anio}-${m}`,met,'max');
    const acum=real.acum(meses.slice(0,i+1));
    let inc='';
    if(!pct&&(mi||ma)){
      const prev=meses.slice(0,i).reverse().find(p=>oV(o,`${anio}-${p}`,met,'min')||oV(o,`${anio}-${p}`,met,'max'));
      if(prev){ const dm=mi-oV(o,`${anio}-${prev}`,met,'min'), dx=ma-oV(o,`${anio}-${prev}`,met,'max');
        inc=`<small>+${nf(dm)} / +${nf(dx)}</small>`; }
    }
    return `<tr${m===vig.mes?' class="vig"':''}><td>${MESES_L[Number(m)-1]}${inc}</td>
      <td class="num">${fmt(mi)}</td><td class="num">${fmt(ma)}</td>
      <td class="num"><strong>${fmt(acum)}</strong></td>
      <td class="num ${cumpl(acum,mi,ma)>=100?'cumple':cumpl(acum,mi,ma)===0?'nocumple':''}">${(mi||ma)?nf(cumpl(acum,mi,ma),0)+'%':'—'}</td></tr>`;
  }).join('');
  return {vig,RT,html:`<div class="scroll"><table>
      <thead><tr><th>Mes</th><th class="num">Mín acum.</th><th class="num">Máx acum.</th><th class="num">Real acum.</th><th class="num">Cumpl.</th></tr></thead>
      <tbody>${filas}</tbody></table></div>
    ${vig.mes?`<p class="sub" style="margin:9px 0 0">Objetivo vigente: el de <strong>${MESES_L[Number(vig.mes)-1]}</strong>, que ya cubre ${vig.cubre.map(m=>MESES[Number(m)-1]).join(' + ')}.${vig.cubre.length<meses.length?' Cuando llegue el de '+MESES_L[Number(meses[vig.cubre.length])-1]+', reemplaza a este.':''}</p>`
      :`<p class="sub" style="margin:9px 0 0">Sin objetivo cargado en este trimestre.</p>`}`};
}

    <p class="vacio">Los objetivos están definidos para combustible.<br>Si Tienda Full o Boxes también tienen, decime cómo son y los agrego.</p></div></div>`;
  const o=await admin('objetivos',{}), r=await roll('playa');

  const anio=(S.objVerAnio&&anios.includes(S.objVerAnio))?S.objVerAnio:anios[anios.length-1];
  const t=S.objVerTrim||trimPorDefecto(Object.keys(r),anio), meses=TRIM[t-1];
  const iN=idsFam('Naftas'), iD=idsFam('Diesel');

  const vN=m=>m==='trim'?meses.reduce((a,x)=>a+vendFam(r,`${anio}-${x}`,iN),0):vendFam(r,`${anio}-${m}`,iN);
  const vD=m=>m==='trim'?meses.reduce((a,x)=>a+vendFam(r,`${anio}-${x}`,iD),0):vendFam(r,`${anio}-${m}`,iD);
  const vI=m=>m==='trim'?meses.reduce((a,x)=>a+vendFam(r,`${anio}-${x}`,[ID_INFINIA]),0):vendFam(r,`${anio}-${m}`,[ID_INFINIA]);
  const vMix=m=>{const n=vN(m);return n?vI(m)/n*100:0;};

  const acumF=ids=>ms=>ms.reduce((a,m)=>a+vendFam(r,`${anio}-${m}`,ids),0);
  const bN=bloqueMeta(o,anio,meses,'naftas',{mes:vN,acum:acumF(iN)},'L');
  const bD=bloqueMeta(o,anio,meses,'diesel',{mes:vD,acum:acumF(iD)},'L');
  const bM=bloqueMeta(o,anio,meses,'mix',{mes:vMix,acum:ms=>{
    const n=acumF(iN)(ms); return n?acumF([ID_INFINIA])(ms)/n*100:0; }},'%');

  return `<div class="envoltorio">
    <div class="filtro"><span class="et">Trimestre</span>
      <select id="objVerAnio">${anios.map(a=>`<option value="${a}"${a===anio?' selected':''}>${a}</option>`).join('')}</select>

    </div>
    <div class="totem">
      <div class="totem-cab"><div class="t">${ROMANO[t-1]} trimestre ${anio}</div>
        <div class="d">${meses.map(m=>MESES[Number(m)-1]).join(' · ')}</div></div>
      <div class="linea-totem"><span class="chip" style="background:#22E3F5"></span><span class="nom">Naftas</span>
        <span class="guia"></span><span class="val">${nf(bN.RT)}<i>L</i></span></div>
      <div class="linea-totem"><span class="chip" style="background:#3DE0A0"></span><span class="nom">Diesel</span>
        <span class="guia"></span><span class="val">${nf(bD.RT)}<i>L</i></span></div>
      <div class="totem-total"><span class="nom">Mix Infinia</span>
        <span class="val">${nf(bM.RT,1)}<i>%</i></span></div>
    </div>
    <div class="tarjeta">
      <h2>Volumen naftas</h2>
      <p class="sub">Súper + Infinia Nafta. El objetivo ya viene acumulado, así que vale el del último mes cargado.</p>
      ${barraMeta(bN.RT,bN.vig.min,bN.vig.max,'L')}
      ${bN.html}
    </div>
    <div class="tarjeta">
      <h2>Volumen diesel</h2>
      <p class="sub">Diesel 500 + Infinia Diesel. El objetivo ya viene acumulado, así que vale el del último mes cargado.</p>
      ${barraMeta(bD.RT,bD.vig.min,bD.vig.max,'L')}
      ${bD.html}
    </div>
    <div class="tarjeta">
      <h2>Mix Infinia</h2>
      <p class="sub">Cuánto pesa Infinia Nafta dentro del total de naftas, sobre los meses que cubre el objetivo vigente.</p>
      ${barraMeta(bM.RT,bM.vig.min,bM.vig.max,'%')}

    </div>
  </div>`;
}

async function leerPlanillas(archivos){
  if(typeof XLSX==='undefined') return {error:'No se pudo cargar el lector de Excel. Revisá la conexión y recargá.'};
  const res={filas:0,saltadas:0,meses:{},desconocidas:[]};
  const desc=new Set();
  for(const f of archivos){
    let wb;
    try{ wb=XLSX.read(await f.arrayBuffer(),{type:'array'}); }
    catch(e){ return {error:`“${f.name}” no se pudo abrir como Excel.`}; }
    const filas=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,blankrows:false});
    const iCab=filas.findIndex(r=>r.some(c=>String(c||'').trim().toLowerCase().startsWith('fecha')));
    if(iCab<0) return {error:`En “${f.name}” no encontré la fila de encabezado con “Fecha Apertura”.`};
    const cab=filas[iCab].map(c=>String(c||'').trim().toUpperCase());
    const cols={};
    cab.forEach((nom,i)=>{
      if(!nom||i===0||nom.startsWith('TOTAL')) return;
      const pid=Object.keys(ALIAS).find(k=>ALIAS[k].includes(nom));
      if(pid) cols[i]=pid; else desc.add(cab[i]);
    });
    for(const r of filas.slice(iCab+1)){
      const m=String(r[0]||'').trim().match(/(\d{2})\/(\d{2})\/(\d{4})\s*\((\d)\)/);
      if(!m){ if(String(r[0]||'').trim()) res.saltadas++; continue; }
      const [,dia,mm,aa,turno]=m, ym=`${aa}-${mm}`;
      if(!res.meses[ym]) res.meses[ym]={dias:{},total:0,existe:false};
      const prod={};
      for(const [i,pid] of Object.entries(cols)){
        const v=Number(r[i])||0;
        if(v>0){ prod[pid]=Math.round(v*100)/100; res.meses[ym].total+=v; }
      }
      res.meses[ym].dias[dia]=res.meses[ym].dias[dia]||{};
      res.meses[ym].dias[dia]['T'+turno]={prod,ts:Date.now()};
      res.filas++;
    }
  }
  for(const ym of Object.keys(res.meses)){
    res.meses[ym].total=Math.round(res.meses[ym].total*100)/100;
    res.meses[ym].existe=Object.keys(await ops('playa',ym)).length>0;
  }
  res.desconocidas=[...desc];
  if(!res.filas) return {error:'No encontré filas con fecha y turno, como “Wed 01/01/2026 (1)”.'};
  return res;
}

async function recalcularCombosMes(){

  const C=await combos();
  const meses=[...new Set(Object.keys(dias).map(f=>f.slice(0,7)))];

const objTNorm=(o,ym)=>{const x=o[ym]||{};const g=k=>({min:(x[k]&&x[k].min!=null)?x[k].min:'',max:(x[k]&&x[k].max!=null)?x[k].max:''});
  const r={}; METS_TIENDA().forEach(m=>r[m.k]=g(m.k)); return r;};
const objTV=(o,ym,k,q)=>Number(((o[ym]||{})[k]||{})[q])||0;
function objTVigente(o,anio,meses,k){
  let mes=null;
  meses.forEach(m=>{ if(objTV(o,`${anio}-${m}`,k,'min')||objTV(o,`${anio}-${m}`,k,'max')) mes=m; });
  if(!mes) return {mes:null,min:0,max:0,cubre:[]};
  return {mes,min:objTV(o,`${anio}-${mes}`,k,'min'),max:objTV(o,`${anio}-${mes}`,k,'max'),
          cubre:meses.slice(0,meses.indexOf(mes)+1)};
}
const realTienda=(r,anio,meses,k,C)=>(meses||[]).reduce((a,m)=>{
  if(k==='combos') return a+(Number((C||{})[`${anio}-${m}`])||0);
  const x=r[`${anio}-${m}`]; if(!x) return a;
  if(k==='tickets') return a+(x.tickets||0);
  return a+((x.porProd||{})[k]||0);
},0);
